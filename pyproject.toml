[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "gee2oge-algorithms"
version = "0.1.0"
description = "Standalone, auditable algorithms for GEE to OGE workflow migration"
requires-python = ">=3.10"
dependencies = ["numpy>=1.24"]

[project.optional-dependencies]
spatial = ["scipy>=1.10", "scikit-image>=0.21"]
test = ["pytest>=7.0"]

[tool.pytest.ini_options]
testpaths = ["tests"]


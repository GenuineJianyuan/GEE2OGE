<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>智能 GEE → OGE 转换</title><style>
:root{--ink:#172033;--muted:#64748b;--line:#dbe4ef;--blue:#2563eb;--bg:#f5f7fb;--card:#fff;--bad:#c33232}*{box-sizing:border-box}body{margin:0;background:radial-gradient(circle at 90% 0,#d7ecff 0,transparent 30%),linear-gradient(180deg,#edf4ff,#f5f7fb 360px);color:var(--ink);font:14px -apple-system,"Segoe UI",Arial}.shell{max-width:1520px;margin:auto;padding:36px 28px 50px}.hero,.status,.bar,.tools{display:flex;align-items:center;gap:10px;flex-wrap:wrap}.hero{justify-content:space-between;align-items:flex-start;margin-bottom:24px}.brand{display:flex;gap:14px}.mark{display:grid;place-items:center;width:48px;height:48px;border-radius:15px;background:linear-gradient(145deg,#1744bb,#38bdf8);color:white;font-size:18px;font-weight:800;box-shadow:0 12px 24px rgba(37,99,235,.25)}.eyebrow{margin:2px 0 6px;color:var(--blue);font-size:11px;font-weight:800;letter-spacing:1.2px}h1{margin:0 0 7px;font-size:30px;letter-spacing:-.5px}p,.hint{margin:0;color:var(--muted)}button,input,select,textarea{font:inherit}button,.back{height:40px;border:1px solid var(--blue);border-radius:8px;padding:0 15px;background:var(--blue);color:#fff;font-weight:700;cursor:pointer;transition:.18s}button:hover:not(:disabled){transform:translateY(-1px);background:#1d4ed8}button.secondary,.back{border-color:#cbd9ec;background:rgba(255,255,255,.88);color:#315887}.back{display:inline-flex;align-items:center;text-decoration:none;box-shadow:0 4px 12px rgba(23,32,51,.05)}button:disabled{opacity:.55;cursor:wait}.status{margin-bottom:15px;padding:10px 12px;border:1px solid rgba(219,228,239,.9);border-radius:12px;background:rgba(255,255,255,.74);box-shadow:0 8px 22px rgba(23,32,51,.04)}.chip{display:inline-flex;align-items:center;min-height:29px;border-radius:7px;padding:5px 9px;background:#e9eef6;color:#52657d;font-size:12px;font-weight:600}.chip.ok{background:#dcf6e9;color:#087c54}.chip.bad{background:#fee7e7;color:var(--bad)}label.chip{white-space:nowrap;flex-wrap:nowrap}#provider{width:auto;min-width:180px;height:auto;padding:0;border:0;background:transparent;font-weight:700;color:inherit;white-space:nowrap}.panel,.detail{background:rgba(255,255,255,.94);border:1px solid var(--line);border-radius:13px;box-shadow:0 14px 32px rgba(23,32,51,.07)}.config{display:none;margin-bottom:16px;padding:20px}.config-head{display:flex;justify-content:space-between;align-items:center;margin-bottom:17px;font-size:16px;font-weight:750}.config-grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px}.config-grid label{display:grid;gap:6px;color:#536276;font-size:12px;font-weight:700}input,select{height:40px;padding:0 11px;border:1px solid var(--line);border-radius:7px;background:#fff;color:var(--ink);min-width:0;width:100%}.thinking{display:flex!important;grid-template-columns:auto 1fr;align-items:center;padding-top:26px;gap:8px!important}.thinking input{width:18px;height:18px;padding:0;accent-color:var(--blue)}.bar{padding:12px;margin-bottom:18px}.bar input{min-width:250px}.library{display:none;margin:0 0 18px;padding:16px}.library.show{display:block}.library-head{display:flex;align-items:center;justify-content:space-between;margin-bottom:12px;font-weight:750}.library-list{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:9px;max-height:280px;overflow:auto}.library-item{padding:11px;border:1px solid var(--line);border-radius:8px;background:#fbfdff;cursor:pointer}.library-item:hover{border-color:#86aee9;background:#f2f7ff}.library-item b{display:block;margin-bottom:5px;font-size:13px}.library-item small{color:var(--muted)}.bar input{min-width:250px}.workspace{display:grid;grid-template-columns:1fr 1fr;gap:18px}.panel{min-width:0;overflow:hidden}.panel-head{display:flex;align-items:center;min-height:58px;padding:12px 17px;border-bottom:1px solid var(--line);font-weight:750;background:linear-gradient(90deg,#fff,#f8fbff)}.panel-head:before{content:"";width:9px;height:9px;border-radius:50%;background:#60a5fa;box-shadow:15px 0 #fbbf24,30px 0 #34d399;margin-right:29px}.panel-head small{margin-left:10px;color:var(--muted);font-weight:400}.panel-head .tools{margin-left:auto}.editor{width:100%;height:570px;resize:vertical;border:0;padding:18px;background:linear-gradient(90deg,#f7faff 0,#f7faff 36px,#fff 36px);font:13px/1.7 Consolas,monospace}.code{height:570px;overflow:auto;margin:0;padding:18px;background:#0e192b;background-image:linear-gradient(rgba(148,163,184,.05) 1px,transparent 1px);background-size:100% 27px;color:#dbeafe;font:13px/1.7 Consolas,monospace;white-space:pre-wrap}.detail{margin-top:18px;overflow:hidden}.tabs{display:flex;gap:3px;padding:9px 11px;border-bottom:1px solid var(--line);background:#fbfcfe}.tab{height:34px;border:0;background:transparent;color:#607087;box-shadow:none}.tab.active{background:#e3edff;color:var(--blue)}.tab-content{padding:18px;min-height:184px}.notice{padding:12px 14px;border-left:3px solid #60a5fa;border-radius:6px;background:#eef5ff;color:#30518b}.notice.error{border-color:#f87171;background:#fff0f0;color:var(--bad)}.raw{margin:0;max-height:480px;overflow:auto;border-radius:7px;background:#101827;color:#dbeafe;padding:16px;font:12px/1.65 Consolas,monospace;white-space:pre-wrap}@media(max-width:900px){.shell{padding:22px 16px}.workspace{grid-template-columns:1fr}.config-grid{grid-template-columns:1fr 1fr}.editor,.code{height:390px}}@media(max-width:560px){.config-grid{grid-template-columns:1fr}.bar input,.bar button{width:100%}#provider{min-width:120px}}
</style></head><body><main class="shell"><header class="hero"><div class="brand"><div class="mark">G→O</div><div><div class="eyebrow">GEE2OGE WORKBENCH</div><h1>智能 GEE → OGE 转换</h1><p>专用工作台 · <code>/api/convert-llm</code> · 支持可保存的多模型配置。</p></div></div><a class="back" href="/">← 返回首页</a></header>
<div class="status"><span class="chip" id="llm">LLM 状态：检测中</span><span class="chip" id="runState">等待输入</span><span class="chip" id="record">未保存记录</span><label class="chip">当前模型 <select id="provider"></select></label><button id="manage" class="secondary">管理模型</button><button id="showExamples" class="secondary">案例</button><button id="showHistory" class="secondary">转换记录</button></div>
<section id="providerConfig" class="panel config"><div class="config-head"><span>模型配置</span><button id="cancelManage" class="secondary">取消</button></div><div class="config-grid"><label>正在配置的模型<select id="editProvider"></select></label><label>配置名称<input id="customLabel"></label><label>Base URL<input id="customUrl" placeholder="https://api.example.com/v1"></label><label>模型名<input id="customModel"></label><label>API Key<input id="customKey" type="password" placeholder="留空则保持原 API Key"></label><label>温度<input id="customTemperature" type="number" min="0" max="2" step="0.1"></label><label>最大 Tokens<input id="customTokens" type="number" min="1" max="32768"></label><label>超时（秒）<input id="customTimeout" type="number" min="10" max="1800"></label><label class="thinking"><input id="customThinking" type="checkbox"><span>启用 Thinking（启用时会明确打勾）</span></label></div><div class="tools" style="margin-top:15px"><button id="saveProvider">保存并启用</button><button id="newProvider" class="secondary">新增模型 API</button><button id="deleteProvider" class="secondary">删除此自定义模型</button><span id="providerNotice" class="hint"></span></div></section>
<section id="library" class="panel library"><div class="library-head"><span id="libraryTitle">案例</span><button id="closeLibrary" class="secondary">关闭</button></div><div id="libraryList" class="library-list"><div class="notice">加载中…</div></div></section><div class="panel bar"><input id="caseName" placeholder="案例名称（可选）"><button id="convert">开始智能转换</button><button id="example" class="secondary">载入示例</button><span id="elapsed" class="hint"></span></div><section class="workspace"><article class="panel"><div class="panel-head">GEE JavaScript <small>粘贴 Code Editor 脚本</small></div><textarea id="gee" class="editor" spellcheck="false"></textarea></article><article class="panel"><div class="panel-head">OGE Python <div class="tools"><button id="copy" class="secondary" disabled>复制代码</button><button id="download" class="secondary" disabled>下载 .py</button></div></div><pre id="oge" class="code">转换完成后显示 OGE Python 代码。</pre></article></section><section class="detail"><nav class="tabs"><button class="tab active" data-tab="overview">转换概览</button><button class="tab" data-tab="analysis">LLM 分析</button><button class="tab" data-tab="params">关键参数</button><button class="tab" data-tab="warnings">告警与缺失项</button><button class="tab" data-tab="raw">原始响应</button></nav><div id="detail" class="tab-content"><div class="notice">输入 GEE JavaScript 后点击“开始智能转换”。</div></div></section></main>
<script>
const $=id=>document.getElementById(id);let providers=[],response=null,ogeCode='';const sample="var image = ee.Image('COPERNICUS/S2_SR_HARMONIZED/20230601T032539_20230601T033506_T48RTV');\nvar ndvi = image.normalizedDifference(['B8', 'B4']).rename('NDVI');\nMap.addLayer(ndvi, {min:-1,max:1,palette:['brown','yellow','green']}, 'NDVI');";const esc=v=>String(v??'').replace(/[&<>]/g,x=>({'&':'&amp;','<':'&lt;','>':'&gt;'}[x]));const chip=(id,text,type='')=>{const e=$(id);e.textContent=text;e.className='chip '+type};const currentInfo=()=>providers.find(p=>p.id===$('editProvider').value);
function fillForm(i){if(!i)return;$('customLabel').value=i.label||'';$('customUrl').value=i.base_url||'';$('customModel').value=i.model||'';$('customKey').value='';$('customTemperature').value=i.temperature??.1;$('customTokens').value=i.max_tokens??4096;$('customTimeout').value=i.timeout_seconds??420;$('customThinking').checked=Boolean(i.enable_thinking);$('deleteProvider').style.display=String(i.id).startsWith('custom_')?'inline-block':'none';$('providerNotice').textContent=String(i.id).startsWith('custom_')?'API Key 已隐藏；留空将保留原值。':'正在编辑内置模型参数；保存后将立即切换并持久化。'}function resetForm(){$('customLabel').value='';$('customUrl').value='';$('customModel').value='';$('customKey').value='';$('customTemperature').value=.1;$('customTokens').value=4096;$('customTimeout').value=420;$('customThinking').checked=false;$('deleteProvider').style.display='none';$('providerNotice').textContent='填写后会新增一个模型 API，并自动启用。'}
async function refreshProviders(){const d=await fetch('/api/llm-provider').then(r=>r.json());if(!d.success)throw Error(d.error||'读取模型失败');providers=d.providers||[];const o=providers.map(p=>'<option value="'+esc(p.id)+'">'+esc(p.label)+' · '+esc(p.model)+'</option>').join('');$('provider').innerHTML=o;$('editProvider').innerHTML='<option value="">＋ 新增模型 API</option>'+o;$('provider').value=d.active.id;chip('llm',d.active.label+' · '+d.active.model,'ok');return d.active}async function updateModelAvailability(){try{const d=await fetch('/api/llm-status').then(r=>r.json());chip('runState',d.available?'模型可用':'模型不可用',d.available?'ok':'bad')}catch(e){chip('runState','模型状态未知','bad')}}async function openManage(){try{const a=await refreshProviders();$('providerConfig').style.display='block';$('editProvider').value=$('provider').value;fillForm(providers.find(p=>p.id===a.id)||a)}catch(e){$('providerNotice').textContent='读取配置失败：'+e.message;$('providerConfig').style.display='block'}}
$('manage').onclick=openManage;$('cancelManage').onclick=()=>{$('providerConfig').style.display='none';$('customKey').value=''};$('newProvider').onclick=()=>{$('editProvider').value='';resetForm()};$('editProvider').onchange=()=>{$('editProvider').value?fillForm(currentInfo()):resetForm()};$('provider').onchange=async()=>{try{const d=await fetch('/api/llm-provider',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({provider:$('provider').value})}).then(r=>r.json());if(!d.success)throw Error(d.error||'切换失败');await refreshProviders();await updateModelAvailability()}catch(e){chip('runState','模型不可用','bad')}};
$('saveProvider').onclick=async()=>{const b=$('saveProvider'),id=$('editProvider').value;b.disabled=true;$('providerNotice').textContent='正在保存…';try{const p={provider:id,save_config:Boolean(id),id,label:$('customLabel').value,base_url:$('customUrl').value,model:$('customModel').value,api_key:$('customKey').value,max_tokens:$('customTokens').value,temperature:$('customTemperature').value,timeout_seconds:$('customTimeout').value,enable_thinking:$('customThinking').checked};const d=await fetch(id?'/api/llm-provider':'/api/llm-provider/custom',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(p)}).then(r=>r.json());if(!d.success)throw Error(d.error||'保存失败');await refreshProviders();$('provider').value=d.active.id;$('editProvider').value=d.active.id;fillForm(d.active);$('providerNotice').textContent='已保存并启用；后续转换将使用这组参数。';chip('runState','模型配置已保存','ok')}catch(e){$('providerNotice').textContent='保存失败：'+e.message}finally{b.disabled=false}};$('deleteProvider').onclick=async()=>{const id=$('editProvider').value;if(!String(id).startsWith('custom_')||!confirm('确定删除该自定义模型吗？'))return;const d=await fetch('/api/llm-provider/custom',{method:'DELETE',headers:{'Content-Type':'application/json'},body:JSON.stringify({provider:id})}).then(r=>r.json());if(!d.success){$('providerNotice').textContent='删除失败：'+d.error;return}await refreshProviders();$('providerConfig').style.display='none';chip('runState','已删除自定义模型','ok')};
function render(t='overview'){const r=response?.result||{},b=$('detail');if(!response){b.innerHTML='<div class="notice">等待转换。</div>';return}const v=t==='overview'?(ogeCode?'已生成 OGE Python 代码。':'接口未返回 OGE 代码，请检查告警信息。'):JSON.stringify(t==='analysis'?r.llm_analysis||{}:t==='params'?r.step1?.key_params||r.llm_analysis?.key_params||{}:t==='warnings'?[...(r.llm_enhancements||[]),...(r.step6?.missing_report||[])]:response,null,2);b.innerHTML=t==='overview'?'<div class="notice">'+v+'</div>':'<pre class="raw">'+esc(v)+'</pre>'}document.querySelectorAll('.tab').forEach(x=>x.onclick=()=>{document.querySelectorAll('.tab').forEach(y=>y.classList.remove('active'));x.classList.add('active');render(x.dataset.tab)});$('example').onclick=()=>{$('gee').value=sample};$('copy').onclick=async()=>{await navigator.clipboard.writeText(ogeCode)};$('download').onclick=()=>{const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([ogeCode]));a.download='oge_result.py';a.click();URL.revokeObjectURL(a.href)};
async function showLibrary(kind){const box=$('library'),list=$('libraryList');box.classList.add('show');$('libraryTitle').textContent=kind==='examples'?'案例库':'转换记录';list.innerHTML='<div class="notice">加载中…</div>';try{const d=await fetch(kind==='examples'?'/api/examples':'/api/history?limit=50').then(r=>r.json());const items=kind==='examples'?(d.examples||[]):(d.data||[]);if(!d.success)throw Error(d.error||'读取失败');if(!items.length){list.innerHTML='<div class="notice">暂无'+(kind==='examples'?'案例':'转换记录')+'。</div>';return}list.innerHTML=items.map(item=>kind==='examples'?`<div class="library-item" onclick="loadExample('${esc(item.id)}')"><b>${esc(item.name)}</b><small>${esc(item.description||item.tags?.join(' · ')||'点击载入案例')}</small></div>`:`<div class="library-item" onclick="loadHistory(${Number(item.id)})"><b>#${Number(item.id)} · ${esc(item.case_name||'未命名案例')}</b><small>${esc(item.created_at||'')} · ${esc(item.feasibility||'')}</small></div>`).join('')}catch(e){list.innerHTML='<div class="notice error">加载失败：'+esc(e.message)+'</div>'}}
async function loadExample(id){const d=await fetch('/api/examples/'+encodeURIComponent(id)).then(r=>r.json());if(!d.success)throw Error(d.error||'案例读取失败');const x=d.example;$('caseName').value=x.name||'';$('gee').value=x.gee_code||'';if(x.oge_code){ogeCode=x.oge_code;$('oge').textContent=ogeCode;$('copy').disabled=false;$('download').disabled=false}$('library').classList.remove('show');chip('runState','已载入案例','ok')}
async function loadHistory(id){const d=await fetch('/api/history/'+id).then(r=>r.json());if(!d.success)throw Error(d.error||'记录读取失败');const x=d.data;$('caseName').value=x.case_name||'';$('gee').value=x.gee_code||'';ogeCode=x.step6_workflow||'';$('oge').textContent=ogeCode||'该记录未保存 OGE 代码';$('copy').disabled=!ogeCode;$('download').disabled=!ogeCode;$('library').classList.remove('show');chip('runState','已恢复转换记录 #'+id,'ok')}$('showExamples').onclick=()=>showLibrary('examples');$('showHistory').onclick=()=>showLibrary('history');$('closeLibrary').onclick=()=>$('library').classList.remove('show');
$('convert').onclick=async()=>{const code=$('gee').value.trim();if(!code){chip('runState','请输入 GEE JavaScript','bad');return}const b=$('convert'),s=performance.now();b.disabled=true;try{const r=await fetch('/api/convert-llm',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({gee_code:code,case_name:$('caseName').value.trim()||'智能转换案例'})}),d=await r.json();if(!r.ok||!d.success)throw Error(d.error||'转换失败');response=d;ogeCode=d?.result?.llm_oge_code||d?.result?.step6?.oge_code||'';$('oge').textContent=ogeCode||'未返回 OGE 代码';$('copy').disabled=!ogeCode;$('download').disabled=!ogeCode;chip('runState','模型可用','ok');chip('record',d.record_id?'已保存记录 #'+d.record_id:'转换结果未保存');render()}catch(e){chip('runState','模型或转换不可用','bad');$('detail').innerHTML='<div class="notice error">'+esc(e.message)+'</div>'}finally{$('elapsed').textContent='本次耗时 '+((performance.now()-s)/1000).toFixed(2)+' 秒';b.disabled=false}};refreshProviders().then(updateModelAvailability).catch(e=>chip('runState','模型状态未知','bad'));
</script></body></html>

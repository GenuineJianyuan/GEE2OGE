<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>控制台 | GEE2OGE</title><style>body{margin:0;background:#f5f7fb;color:#1e293b;font:14px Arial,sans-serif}.wrap{max-width:1250px;margin:auto;padding:24px}.top{display:flex;justify-content:space-between;align-items:center}.top a{color:#2563eb;text-decoration:none}.cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:14px;margin:20px 0}.card{background:#fff;border:1px solid #e2e8f0;border-radius:8px;padding:18px}.label{color:#64748b;font-size:12px}.value{font-size:26px;font-weight:bold;margin-top:8px}.ok{color:#087c3d}.warn{color:#b45309}.panel{background:#fff;border:1px solid #e2e8f0;border-radius:8px;padding:16px;margin-bottom:16px}table{width:100%;border-collapse:collapse}th,td{text-align:left;padding:9px;border-bottom:1px solid #e2e8f0}button{height:36px;padding:0 12px;background:#2563eb;color:#fff;border:0;border-radius:5px;cursor:pointer}@media(max-width:700px){table{font-size:12px}}</style></head><body><div class="wrap"><div class="top"><h1>系统控制台</h1><a href="/">返回首页</a></div><div class="cards"><div class="card"><div class="label">LLM 服务</div><div id="llm" class="value">检测中</div></div><div class="card"><div class="label">GEE API 数量</div><div id="gee" class="value">-</div></div><div class="card"><div class="label">OGE API 数量</div><div id="oge" class="value">-</div></div><div class="card"><div class="label">映射数量</div><div id="mapping" class="value">-</div></div><div class="card"><div class="label">历史记录</div><div id="history" class="value">-</div></div></div><div class="panel"><h2>GEE Runner 批次</h2><button onclick="load()">刷新</button><table><thead><tr><th>批次</th><th>进度</th><th>状态</th><th>完成时间</th></tr></thead><tbody id="batches"><tr><td colspan="4">加载中...</td></tr></tbody></table></div></div><script>async function load(){try{const [s,l,b]=await Promise.all([fetch('/api/stats').then(r=>r.json()),fetch('/api/llm-status').then(r=>r.json()),fetch('/api/gee-runner/batch-history').then(r=>r.json())]);if(s.success){const d=s.data;gee.textContent=d.total_gee_apis??'-';oge.textContent=d.total_oge_apis??'-';mapping.textContent=d.total_mappings??'-';history.textContent=d.history_count??'-'}llm.textContent=l.available?'可用':'不可用';llm.className='value '+(l.available?'ok':'warn');batches.innerHTML=(b.batches||[]).map(x=>`<tr><td>${x.id.slice(0,12)}</td><td>${x.completed}/${x.total}</td><td>${x.running?'运行中':x.success?'全部成功':'未全部成功'}</td><td>${x.finished||'-'}</td></tr>`).join('')||'<tr><td colspan="4">暂无批次</td></tr>'}catch(e){document.querySelector('#batches').innerHTML='<tr><td colspan="4">加载失败：'+e.message+'</td></tr>'}}load();setInterval(load,30000)</script></body></html>

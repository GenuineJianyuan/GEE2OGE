      <div class="form-row">
        <div class="form-group half">
          <label>难度</label>
          <select id="edit-case-difficulty">
            <option value="easy">简单</option>
            <option value="medium" selected>中等</option>
            <option value="hard">困难</option>
          </select>
        </div>
        <div class="form-group half">
          <label>标签（用逗号分隔）</label>
          <input type="text" id="edit-case-tags" placeholder="指数计算, 可视化" />
        </div>
      </div>
      <div class="form-group">
        <label>GEE 代码 <span class="required">*</span></label>
        <textarea id="edit-case-gee-code" placeholder="粘贴 GEE JavaScript 代码..." rows="10"></textarea>
      </div>
      <div class="form-group">
        <label>OGE 代码（可选）</label>
        <textarea id="edit-case-oge-code" placeholder="粘贴已转换的 OGE Python 代码（可选）..." rows="6"></textarea>
      </div>
    </div>
    <div class="modal-footer">
      <button class="btn-secondary" onclick="closeEditCaseModal()">取消</button>
      <button class="btn-primary" onclick="submitEditCase()">保存修改</button>
    </div>
  </div>
</div>

<!-- 美化视图模态框（用于缓存结果展示） -->
<div class="modal-overlay" id="pretty-view-modal" onclick="closePrettyViewModal(event)" style="z-index: 2000;">
  <div class="modal-content" style="max-width: 1200px; max-height: 90vh; width: 95vw;" onclick="event.stopPropagation()">
    <div class="modal-header">
      <h3>🎨 美化视图 - 转换结果可视化</h3>
      <button class="modal-close" onclick="closePrettyViewModal()">×</button>
    </div>
    <div class="modal-body" style="padding: 0; overflow: hidden;">
      <div id="pretty-view-modal-content" style="max-height: calc(90vh - 140px); overflow-y: auto;"></div>
    </div>
    <div class="modal-footer">
      <button class="btn-secondary" onclick="closePrettyViewModal()">关闭</button>
      <button class="btn-secondary" onclick="copyCurrentOgeCode()" style="margin-left: auto;">📋 复制 OGE 代码</button>
      <button class="btn-primary" onclick="downloadCurrentOgeCode()">💾 下载 OGE 代码</button>
    </div>
  </div>
</div>

<script>
/**
 * 案例库管理
 */
let examplesData = [];
let loadedCaseIds = new Set();

/**
 * 切换案例面板显示
 */
function toggleCasePanel(btn) {
  const panel = document.getElementById('case-panel');
  const isOpen = panel.classList.toggle('open');
  btn.classList.toggle('active', isOpen);
  btn.textContent = isOpen ? '✕ 关闭' : '📖 案例';
  if (isOpen && examplesData.length === 0) {
    loadExamples();
  }
}

/**
 * 加载案例列表
 */
async function loadExamples() {
  const container = document.getElementById('case-list');
  try {
    const resp = await fetch('/api/examples');
    const data = await resp.json();
    if (!data.success) {
      container.innerHTML = '<div class="empty-hint">加载失败</div>';
      return;
    }
    examplesData = data.examples || [];
    if (examplesData.length === 0) {
      container.innerHTML = '<div class="empty-hint">暂无案例</div>';
      return;
    }
    container.innerHTML = examplesData.map(ex => `
      <div class="case-item" id="case-${ex.id}">
        <div class="case-item-header" onclick="toggleCaseItem('${ex.id}')">
          <div class="case-item-icon">📄</div>
          <div class="case-item-info">
            <div class="case-item-name">${escapeHtml(ex.name)}</div>
            <div class="case-item-meta">
              <span>🔖 ${escapeHtml(ex.source || '未知')}</span>
              <span class="diff-badge diff-${ex.difficulty || 'medium'}">${ex.difficulty === 'easy' ? '简单' : ex.difficulty === 'hard' ? '困难' : '中等'}</span>
              <span>${(ex.tags || []).slice(0, 2).map(t => escapeHtml(t)).join(' · ')}</span>
            </div>
          </div>
          <div class="case-toggle-icon">▶</div>
        </div>
        <div class="case-item-body" id="case-body-${ex.id}">
          <div class="case-detail-desc">${escapeHtml(ex.description)}</div>
          <div class="case-detail-section">
            <div class="case-detail-label">GEE 代码（原）</div>
            <pre class="case-code-block" id="gee-code-${ex.id}">加载中...</pre>
          </div>
          <div class="case-detail-section">
            <div class="case-detail-label">OGE 代码（转换后）</div>
            <pre class="case-code-block" id="oge-code-${ex.id}">加载中...</pre>
          </div>
          <div class="case-detail-actions">
            <button class="case-btn case-btn-primary" onclick="loadCaseToTest('${ex.id}')">🚀 加载到测试</button>
            <button class="case-btn" onclick="copyCaseOge('${ex.id}')">📋 复制 OGE</button>
            <button class="case-btn" onclick="openEditCaseModal('${ex.id}')">✏️ 编辑</button>
            <button class="case-btn case-btn-danger" onclick="deleteCase('${ex.id}')">🗑️ 删除</button>
          </div>
        </div>
      </div>
    `).join('');
  } catch (e) {
    container.innerHTML = '<div class="empty-hint">加载失败: ' + escapeHtml(e.message) + '</div>';
  }
}

/**
 * 展开/收起案例详情
 */
function toggleCaseItem(caseId) {
  const item = document.getElementById('case-' + caseId);
  const isExpanded = item.classList.toggle('expanded');
  if (isExpanded && !loadedCaseIds.has(caseId)) {
    loadCaseDetail(caseId);
  }
}

/**
 * 异步加载案例详情
 */
async function loadCaseDetail(caseId) {
  try {
    const resp = await fetch('/api/examples/' + caseId);
    const data = await resp.json();
    if (!data.success) return;
    const ex = data.example;
    const geeEl = document.getElementById('gee-code-' + caseId);
    const ogeEl = document.getElementById('oge-code-' + caseId);
    if (geeEl) geeEl.textContent = ex.gee_code || '(无代码)';
    if (ogeEl) ogeEl.textContent = ex.oge_code || '(无代码)';
    loadedCaseIds.add(caseId);
  } catch (e) {
    const geeEl = document.getElementById('gee-code-' + caseId);
    const ogeEl = document.getElementById('oge-code-' + caseId);
    if (geeEl) geeEl.textContent = '加载失败';
    if (ogeEl) ogeEl.textContent = '加载失败';
  }
}

/**
 * 加载案例 GEE 代码到测试输入框
 */
async function loadCaseToTest(caseId) {
  try {
    const resp = await fetch('/api/examples/' + caseId);
    const data = await resp.json();
    if (!data.success) { alert('加载失败'); return; }
    const ex = data.example;
    const geeTextarea = document.querySelector('textarea[id$="gee_code"]');
    if (geeTextarea && ex.gee_code) {
      geeTextarea.value = ex.gee_code;
      geeTextarea.dispatchEvent(new Event('input', { bubbles: true }));
    }
    // 关闭面板，方便用户查看输入框
    const panel = document.getElementById('case-panel');
    const btn = document.querySelector('.case-entry-btn');
    panel.classList.remove('open');
    btn.classList.remove('active');
    btn.textContent = '📖 案例';
    alert('已加载到测试输入框，点击"发送"即可开始转换');
  } catch (e) {
    alert('加载失败: ' + e.message);
  }
}

/**
 * 复制案例 OGE 代码
 */
async function copyCaseOge(caseId) {
  try {
    const resp = await fetch('/api/examples/' + caseId);
    const data = await resp.json();
    if (!data.success) return;
    await navigator.clipboard.writeText(data.example.oge_code);
    showToast('OGE 代码已复制', 'success');
  } catch (e) {
    showToast('复制失败', 'error');
  }
}

// ============================================================
// 添加案例功能
// ============================================================

/**
 * 打开添加案例模态框
 */
function openAddCaseModal() {
  const modal = document.getElementById('add-case-modal');
  modal.classList.add('active');
}

/**
 * 关闭添加案例模态框
 */
function closeAddCaseModal(event) {
  if (event && event.target.id !== 'add-case-modal' && event.type === 'click') {
    return;
  }
  const modal = document.getElementById('add-case-modal');
  modal.classList.remove('active');
  // 清空表单
  ['case-name', 'case-description', 'case-source', 'case-tags', 'case-gee-code', 'case-oge-code'].forEach(id => {
    const el = document.getElementById(id);
    if (el) el.value = '';
  });
  const difficulty = document.getElementById('case-difficulty');
  if (difficulty) difficulty.value = 'medium';
}

/**
 * 提交新案例到后端
 */
async function submitAddCase() {
  const name = document.getElementById('case-name').value.trim();
  const gee_code = document.getElementById('case-gee-code').value.trim();

  // 校验必填项
  if (!name) {
    showToast('请填写案例名称', 'warning');
    document.getElementById('case-name').focus();
    return;
  }
  if (!gee_code) {
    showToast('请填写 GEE 代码', 'warning');
    document.getElementById('case-gee-code').focus();
    return;
  }

  const tagsText = document.getElementById('case-tags').value.trim();
  const tags = tagsText ? tagsText.split(/[,，]/).map(t => t.trim()).filter(Boolean) : [];

  const payload = {
    name: name,
    gee_code: gee_code,
    oge_code: document.getElementById('case-oge-code').value.trim(),
    description: document.getElementById('case-description').value.trim(),
    tags: tags,
    source: document.getElementById('case-source').value.trim(),
    difficulty: document.getElementById('case-difficulty').value
  };

  try {
    const btn = event.target;
    const originalText = btn.textContent;
    btn.textContent = '保存中...';
    btn.disabled = true;

    const resp = await fetch('/api/examples', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify(payload)
    });

    const data = await resp.json();
    if (data.success) {
      showToast('案例添加成功', 'success');
      closeAddCaseModal();
      // 重新加载案例列表
      examplesData = [];
      loadExamples();
      // 展开新添加的案例
      setTimeout(() => {
        toggleCaseItem(data.example.id);
        // 加载案例详情
        const item = document.getElementById('case-' + data.example.id);
        if (item) item.scrollIntoView({ behavior: 'smooth', block: 'center' });
      }, 300);
    } else {
      showToast('添加失败: ' + (data.error || '未知错误'), 'error');
    }
  } catch (e) {
    showToast('请求失败: ' + e.message, 'error');
  } finally {
    const btn = document.querySelector('.btn-primary[onclick="submitAddCase()"]');
    if (btn) {
      btn.textContent = '保存案例';
      btn.disabled = false;
    }
  }
}

// AI 智能检测功能
// ============================================================

/**
 * 使用 LLM 智能检测案例元数据，自动填充表单
 * @param {string} mode - 'add' 或 'edit'，决定填充哪个表单
 */
async function aiDetectCase(mode) {
  const geeCodeId = mode === 'add' ? 'case-gee-code' : 'edit-case-gee-code';
  const ogeCodeId = mode === 'add' ? 'case-oge-code' : 'edit-case-oge-code';
  const btnId = mode === 'add' ? 'ai-detect-btn' : 'ai-detect-btn-edit';

  const geeCode = document.getElementById(geeCodeId).value.trim();
  if (!geeCode) {
    showToast('请先填写 GEE 代码', 'warning');
    return;
  }

  const btn = document.getElementById(btnId);
  const originalText = btn.textContent;
  btn.textContent = '🤖 分析中...';
  btn.disabled = true;

  try {
    const ogeCode = document.getElementById(ogeCodeId).value.trim();

    const resp = await fetch('/api/examples/analyze', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ gee_code: geeCode, oge_code: ogeCode })
    });

    const data = await resp.json();
    if (!data.success) {
      showToast('AI 分析失败: ' + (data.error || '未知错误'), 'error');
      return;
    }

    const meta = data.metadata;

    // 自动填充表单
    if (meta.name) {
      const nameId = mode === 'add' ? 'case-name' : 'edit-case-name';
      const nameInput = document.getElementById(nameId);
      if (!nameInput.value.trim()) {
        nameInput.value = meta.name;
      } else {
        // 如果已有值，提示用户
        showToast(`建议名称:「${meta.name}」（已保留现有值）`, 'info');
      }
    }

    const descId = mode === 'add' ? 'case-description' : 'edit-case-description';
    if (meta.description) {
      document.getElementById(descId).value = meta.description;
    }

    const sourceId = mode === 'add' ? 'case-source' : 'edit-case-source';
    if (meta.source) {
      document.getElementById(sourceId).value = meta.source;
    }

    const diffId = mode === 'add' ? 'case-difficulty' : 'edit-case-difficulty';
    if (meta.difficulty && ['easy', 'medium', 'hard'].includes(meta.difficulty)) {
      document.getElementById(diffId).value = meta.difficulty;
    }

    const tagsId = mode === 'add' ? 'case-tags' : 'edit-case-tags';
    if (meta.tags && meta.tags.length > 0) {
      document.getElementById(tagsId).value = meta.tags.join(', ');
    }

    showToast('AI 分析完成，已自动填充案例信息', 'success');
  } catch (e) {
    showToast('请求失败: ' + e.message, 'error');
  } finally {
    btn.textContent = originalText;
    btn.disabled = false;
  }
}

// 编辑案例功能
// ============================================================

/**
 * 打开编辑案例模态框，加载案例当前数据
 */
async function openEditCaseModal(caseId) {
  try {
    showToast('加载案例数据...', 'info');
    const resp = await fetch('/api/examples/' + caseId);
    const data = await resp.json();
    if (!data.success) {
      showToast('加载失败: ' + (data.error || '未知错误'), 'error');
      return;
    }

    const ex = data.example;
    document.getElementById('edit-case-id').value = ex.id;
    document.getElementById('edit-case-name').value = ex.name || '';
    document.getElementById('edit-case-description').value = ex.description || '';
    document.getElementById('edit-case-source').value = ex.source || '';
    document.getElementById('edit-case-difficulty').value = ex.difficulty || 'medium';
    document.getElementById('edit-case-tags').value = (ex.tags || []).join(', ');
    document.getElementById('edit-case-gee-code').value = ex.gee_code || '';
    document.getElementById('edit-case-oge-code').value = ex.oge_code || '';

    document.getElementById('edit-case-modal').classList.add('active');
  } catch (e) {
    showToast('请求失败: ' + e.message, 'error');
  }
}

/**
 * 关闭编辑案例模态框
 */
function closeEditCaseModal(event) {
  if (event && event.target.id !== 'edit-case-modal' && event.type === 'click') {
    return;
  }
  document.getElementById('edit-case-modal').classList.remove('active');
}

/**
 * 提交案例修改到后端
 */
async function submitEditCase() {
  const caseId = document.getElementById('edit-case-id').value.trim();
  const name = document.getElementById('edit-case-name').value.trim();
  const gee_code = document.getElementById('edit-case-gee-code').value.trim();

  if (!caseId) {
    showToast('案例 ID 丢失', 'error');
    return;
  }
  if (!name) {
    showToast('请填写案例名称', 'warning');
    document.getElementById('edit-case-name').focus();
    return;
  }
  if (!gee_code) {
    showToast('请填写 GEE 代码', 'warning');
    document.getElementById('edit-case-gee-code').focus();
    return;
  }

  const tagsText = document.getElementById('edit-case-tags').value.trim();
  const tags = tagsText ? tagsText.split(/[,，]/).map(t => t.trim()).filter(Boolean) : [];

  const payload = {
    name: name,
    gee_code: gee_code,
    oge_code: document.getElementById('edit-case-oge-code').value.trim(),
    description: document.getElementById('edit-case-description').value.trim(),
    tags: tags,
    source: document.getElementById('edit-case-source').value.trim(),
    difficulty: document.getElementById('edit-case-difficulty').value
  };

  try {
    const btn = event.target;
    const originalText = btn.textContent;
    btn.textContent = '保存中...';
    btn.disabled = true;

    const resp = await fetch('/api/examples/' + caseId, {
      method: 'PUT',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify(payload)
    });

    const data = await resp.json();
    if (data.success) {
      showToast('案例修改成功', 'success');
      closeEditCaseModal();
      // 重新加载案例列表
      examplesData = [];
      loadExamples();
      // 展开修改的案例
      setTimeout(() => {
        toggleCaseItem(caseId);
        const item = document.getElementById('case-' + caseId);
        if (item) item.scrollIntoView({ behavior: 'smooth', block: 'center' });
      }, 300);
    } else {
      showToast('修改失败: ' + (data.error || '未知错误'), 'error');
    }
  } catch (e) {
    showToast('请求失败: ' + e.message, 'error');
  } finally {
    const btn = document.getElementById('edit-case-modal').querySelector('.btn-primary');
    if (btn) {
      btn.textContent = '保存修改';
      btn.disabled = false;
    }
  }
}

// 删除案例功能
// ============================================================

/**
 * 删除指定案例
 */
async function deleteCase(caseId) {
  const caseItem = document.getElementById('case-' + caseId);
  let caseName = caseId;
  if (caseItem) {
    const nameEl = caseItem.querySelector('.case-item-name');
    if (nameEl) caseName = nameEl.textContent;
  }

  if (!confirm(`确定要删除案例「${caseName}」吗？此操作不可撤销。`)) return;

  try {
    showToast('删除中...', 'info');
    const resp = await fetch('/api/examples/' + caseId, {
      method: 'DELETE'
    });
    const data = await resp.json();
    if (data.success) {
      showToast('案例已删除', 'success');
      // 从本地数据中移除
      examplesData = examplesData.filter(ex => ex.id !== caseId);
      // 从DOM中移除
      if (caseItem) {
        caseItem.style.transition = 'all 0.3s';
        caseItem.style.opacity = '0';
        caseItem.style.height = '0';
        setTimeout(() => {
          caseItem.remove();
          // 如果没有案例了，显示空提示
          const container = document.getElementById('case-list');
          if (container.querySelectorAll('.case-item').length === 0) {
            container.innerHTML = '<div class="empty-hint">暂无案例</div>';
          }
        }, 300);
      }
    } else {
      showToast('删除失败: ' + (data.error || '未知错误'), 'error');
    }
  } catch (e) {
    showToast('请求失败: ' + e.message, 'error');
  }
}

/**
 * 点击外部关闭面板
 */
document.addEventListener('click', function(e) {
  const entry = document.getElementById('case-entry');
  if (!entry.contains(e.target)) {
    const panel = document.getElementById('case-panel');
    const btn = document.querySelector('.case-entry-btn');
    if (panel.classList.contains('open')) {
      panel.classList.remove('open');
      btn.classList.remove('active');
      btn.textContent = '📖 案例';
    }
  }
});
</script>
</body>
</html>

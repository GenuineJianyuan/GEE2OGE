<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<title>GEE2OGE 接口测试控制台</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    font-family: -apple-system, "Microsoft YaHei", sans-serif;
    background: #f0f2f5;
    color: #1f2328;
    display: flex;
    min-height: 100vh;
  }
  /* 左侧导航 */
  .sidebar {
    width: 320px;
    background: #1f2328;
    color: #f6f8fa;
    padding: 16px 0;
    flex-shrink: 0;
    overflow-y: auto;
  }
  .sidebar h1 {
    font-size: 16px;
    padding: 0 20px 12px;
    border-bottom: 1px solid #30363d;
    margin-bottom: 12px;
    color: #58a6ff;
  }
  .sidebar .topnav {
    display: flex;
    gap: 6px;
    padding: 0 16px 12px;
    border-bottom: 1px solid #30363d;
    margin-bottom: 8px;
  }
  .sidebar .topnav a {
    flex: 1;
    text-align: center;
    color: #8b949e;
    text-decoration: none;
    font-size: 11px;
    padding: 5px 4px;
    border-radius: 4px;
    background: #0d1117;
    transition: all 0.15s;
  }
  .sidebar .topnav a:hover { color: #f6f8fa; }
  .sidebar .topnav a.active { color: #58a6ff; background: #161f2a; }
  .group-title {
    font-size: 12px;
    color: #8b949e;
    padding: 12px 20px 6px;
    text-transform: uppercase;
    letter-spacing: 1px;
  }
  .api-item {
    padding: 10px 20px;
    cursor: pointer;
    border-left: 3px solid transparent;
    transition: background 0.15s, border-color 0.15s;
    font-size: 13px;
  }
  .api-item:hover { background: #30363d; }
  .api-item.active {
    background: #0d1117;
    border-left-color: #58a6ff;
  }
  .api-item.active .api-path { color: #58a6ff; }
  .method-badge {
    font-size: 10px;
    padding: 2px 6px;
    border-radius: 3px;
    font-weight: 600;
    min-width: 40px;
    text-align: center;
    display: inline-block;
  }
  .method-GET { background: #1f6feb; color: #fff; }
  .method-POST { background: #bf8700; color: #fff; }
  .api-path { font-family: monospace; font-size: 12px; display: block; margin-bottom: 2px; }
  .api-desc { font-size: 11px; color: #8b949e; display: block; }
  /* 右侧主体 */
  .main {
    flex: 1;
    padding: 24px;
    overflow-y: auto;
  }
  .api-header {
    background: #fff;
    border-radius: 6px;
    padding: 20px;
    margin-bottom: 16px;
    box-shadow: 0 1px 2px rgba(0,0,0,0.05);
  }
  .api-title {
    display: flex;
    align-items: center;
    gap: 10px;
    font-size: 20px;
    font-weight: 600;
    margin-bottom: 8px;
    font-family: monospace;
  }
  .api-desc-full { color: #656d76; font-size: 14px; line-height: 1.6; }
  .api-url {
    font-family: monospace;
    background: #f6f8fa;
    padding: 8px 12px;
    border-radius: 4px;
    margin-top: 12px;
    font-size: 13px;
  }
  .section {
    background: #fff;
    border-radius: 6px;
    padding: 20px;
    margin-bottom: 16px;
    box-shadow: 0 1px 2px rgba(0,0,0,0.05);
  }
  .section h2 {
    font-size: 14px;
    color: #656d76;
    margin-bottom: 16px;
    padding-bottom: 8px;
    border-bottom: 1px solid #eaeef2;
    display: flex;
    justify-content: space-between;
    align-items: center;
  }
  .param-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 14px; }
  .param-grid.full { grid-template-columns: 1fr; }
  .param-field label {
    display: block;
    font-size: 13px;
    color: #24292f;
    margin-bottom: 4px;
    font-weight: 500;
  }
  .param-field .req { color: #cf222e; }
  .param-field .hint { color: #8b949e; font-size: 11px; margin-top: 3px; }
  .param-field .type-tag {
    font-size: 10px;
    color: #656d76;
    background: #eaeef2;
    padding: 1px 6px;
    border-radius: 3px;
    font-family: monospace;
    margin-left: 6px;
  }
  .param-field input,
  .param-field select,
  .param-field textarea {
    width: 100%;
    padding: 8px 12px;
    border: 1px solid #d0d7de;
    border-radius: 4px;
    font-size: 13px;
    font-family: inherit;
    background: #fff;
    transition: border-color 0.15s;
  }
  .param-field input:focus,
  .param-field select:focus,
  .param-field textarea:focus {
    outline: none;
    border-color: #0969da;
    box-shadow: 0 0 0 3px rgba(9,105,218,0.2);
  }
  .param-field textarea {
    font-family: "SFMono-Regular", Consolas, monospace;
    font-size: 12px;
    line-height: 1.5;
    min-height: 120px;
    resize: vertical;
  }
  .param-field textarea.code { min-height: 220px; }
  .button-row { display: flex; gap: 10px; margin-top: 16px; }
  .btn {
    padding: 8px 18px;
    border-radius: 4px;
    border: 1px solid transparent;
    cursor: pointer;
    font-size: 13px;
    font-weight: 500;
    transition: all 0.15s;
  }
  .btn-primary { background: #1f6feb; color: #fff; }
  .btn-primary:hover { background: #1a5fd4; }
  .btn-secondary { background: #fff; color: #24292f; border-color: #d0d7de; }
  .btn-secondary:hover { background: #f6f8fa; }
  /* 响应区域 */
  .response-header {
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-bottom: 12px;
  }
  .status-badge {
    padding: 2px 8px;
    border-radius: 12px;
    font-size: 12px;
    font-weight: 600;
    font-family: monospace;
  }
  .status-ok { background: #dafbe1; color: #1a7f37; }
  .status-warn { background: #fff8c5; color: #9a6700; }
  .status-err { background: #ffebe9; color: #cf222e; }
  .response-time { font-size: 12px; color: #656d76; }
  pre.response-body {
    background: #0d1117;
    color: #e6edf3;
    padding: 16px;
    border-radius: 6px;
    font-family: "SFMono-Regular", Consolas, monospace;
    font-size: 12px;
    line-height: 1.5;
    overflow-x: auto;
    max-height: 500px;
    overflow-y: auto;
    white-space: pre;
    tab-size: 2;
  }
  /* 输入输出规范说明 */
  .spec-table {
    width: 100%;
    border-collapse: collapse;
    font-size: 12px;
    margin-top: 8px;
  }
  .spec-table th,
  .spec-table td {
    border: 1px solid #eaeef2;
    padding: 6px 10px;
    text-align: left;
    vertical-align: top;
  }
  .spec-table th {
    background: #f6f8fa;
    color: #656d76;
    font-weight: 600;
  }
  .spec-table code {
    background: #f6f8fa;
    padding: 1px 4px;
    border-radius: 3px;
    font-family: monospace;
    color: #1f2328;
  }
  .example-box {
    background: #0d1117;
    color: #e6edf3;
    padding: 12px;
    border-radius: 4px;
    font-family: "SFMono-Regular", Consolas, monospace;
    font-size: 11px;
    line-height: 1.5;
    overflow-x: auto;
    margin-top: 8px;
    white-space: pre;
  }
  .empty-hint {
    padding: 20px;
    text-align: center;
    color: #8b949e;
    font-size: 13px;
    background: #f6f8fa;
    border-radius: 6px;
  }

  /* 美化视图样式 */
  .pretty-view {
    background: #f6f8fa;
    border-radius: 8px;
    padding: 16px;
    margin-top: 12px;
    border: 1px solid #d0d7de;
  }
  .pretty-view-header {
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-bottom: 12px;
    padding-bottom: 8px;
    border-bottom: 2px solid #d0d7de;
  }
  .pretty-view-title {
    font-size: 14px;
    font-weight: 700;
    color: #1f2328;
  }
  .pretty-view-tabs {
    display: flex;
    gap: 4px;
    margin-bottom: 12px;
    border-bottom: 1px solid #d0d7de;
  }
  .pretty-tab {
    padding: 8px 16px;
    background: none;
    border: none;
    border-bottom: 2px solid transparent;
    cursor: pointer;
    font-size: 13px;
    color: #656d76;
    font-weight: 500;
    margin-bottom: -1px;
  }
  .pretty-tab.active {
    border-color: #0969da;
    color: #0969da;
  }
  .pretty-tab-content { display: none; }
  .pretty-tab-content.active { display: block; }
  
  /* 概览卡片 */
  .overview-grid {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(150px, 1fr));
    gap: 12px;
    margin-bottom: 16px;
  }
  .overview-card {
    background: white;
    border: 1px solid #d0d7de;
    border-radius: 8px;
    padding: 14px;
    text-align: center;
  }
  .overview-card .value {
    font-size: 24px;
    font-weight: 700;
    color: #0969da;
  }
  .overview-card .label {
    font-size: 12px;
    color: #656d76;
    margin-top: 4px;
  }
  .badge {
    display: inline-block;
    padding: 3px 10px;
    border-radius: 12px;
    font-size: 11px;
    font-weight: 600;
  }
  .badge-success { background: #dafbe1; color: #1a7f37; }
  .badge-warning { background: #fff8c5; color: #9a6700; }
  .badge-danger { background: #ffebe9; color: #cf222e; }
  .badge-info { background: #ddf4ff; color: #0969da; }
  
  /* 步骤链条 */
  .step-flow {
    display: flex;
    flex-direction: column;
    gap: 0;
  }
  .step-item {
    display: flex;
    gap: 14px;
    padding: 10px 0;
    position: relative;
  }
  .step-item:not(:last-child)::before {
    content: '';
    position: absolute;
    left: 13px;
    top: 36px;
    bottom: -6px;
    width: 2px;
    background: #d0d7de;
  }
  .step-item.done:not(:last-child)::before { background: #1a7f37; }
  .step-icon {
    width: 28px;
    height: 28px;
    border-radius: 50%;
    display: flex;
    align-items: center;
    justify-content: center;
    flex-shrink: 0;
    font-size: 12px;
    font-weight: 600;
    background: #d0d7de;
    color: #656d76;
    z-index: 1;
  }
  .step-item.done .step-icon { background: #1a7f37; color: white; }
  .step-content { flex: 1; min-width: 0; }
  .step-title {
    font-size: 13px;
    font-weight: 600;
    color: #1f2328;
    margin-bottom: 2px;
  }
  .step-desc {
    font-size: 12px;
    color: #656d76;
    margin-bottom: 6px;
  }
  .step-result {
    background: white;
    border: 1px solid #d0d7de;
    border-radius: 6px;
    padding: 10px 12px;
    font-size: 12px;
    line-height: 1.6;
  }
  .step-result .field {
    margin-bottom: 4px;
  }
  .step-result .field:last-child { margin-bottom: 0; }
  .step-result .field-label {
    color: #656d76;
    font-weight: 500;
    margin-right: 6px;
  }
  .step-result .field-value {
    color: #1f2328;
  }
  .api-chip {
    display: inline-block;
    padding: 2px 8px;
    margin: 2px;
    background: #ddf4ff;
    color: #0969da;
    border-radius: 4px;
    font-size: 11px;
    font-family: monospace;
  }
  .code-block {
    background: #0d1117;
    color: #e6edf3;
    padding: 12px;
    border-radius: 6px;
    font-family: "SFMono-Regular", Consolas, monospace;
    font-size: 12px;
    line-height: 1.5;
    white-space: pre-wrap;
    word-break: break-all;
    max-height: 400px;
    overflow-y: auto;
    overflow-x: auto;
  }
  .missing-section {
    margin-bottom: 16px;
    padding: 12px;
    border-radius: 6px;
  }
  .missing-section.blocking {
    background: #ffebe9;
    border: 1px solid #ffcecb;
  }
  .missing-section.non-blocking {
    background: #fff8c5;
    border: 1px solid #f2cc60;
  }
  .missing-title {
    font-size: 13px;
    font-weight: 600;
    margin-bottom: 8px;
  }
  .suggestion-list {
    list-style: none;
    padding: 0;
    margin: 8px 0 0 0;
  }
  .suggestion-list li {
    padding: 8px 12px;
    background: #f6f8fa;
    border-radius: 4px;
    margin-bottom: 6px;
    font-size: 12px;
  }
  .suggestion-list code {
    background: white;
    padding: 1px 6px;
    border-radius: 3px;
    font-family: monospace;
    color: #0969da;
    margin-right: 6px;
  }
  
  /* 视图切换 */
  .view-switch {
    display: flex;
    gap: 6px;
    padding: 0 16px 12px;
    border-bottom: 1px solid #30363d;
    margin-bottom: 8px;
  }
  .view-switch button {
    flex: 1;
    text-align: center;
    color: #8b949e;
    background: transparent;
    border: none;
    font-size: 12px;
    padding: 6px 4px;
    border-radius: 4px;
    cursor: pointer;
    transition: all 0.15s;
  }
  .view-switch button:hover { color: #f6f8fa; background: #30363d; }
  .view-switch button.active { color: #58a6ff; background: #161f2a; font-weight: 600; }
  
  /* GEE 示例视图 */
  .gee-sample-view { display: none; }
  .gee-sample-view.active { display: block; }
  .gee-sample-toolbar {
    background: #fff;
    border-radius: 6px;
    padding: 14px 20px;
    margin-bottom: 16px;
    box-shadow: 0 1px 2px rgba(0,0,0,0.05);
    display: flex;
    gap: 12px;
    align-items: center;
    flex-wrap: wrap;
  }
  .gee-sample-toolbar .title {
    font-size: 16px;
    font-weight: 600;
    color: #1f2328;
    margin-right: auto;
  }
  .gee-sample-toolbar .stats { font-size: 12px; color: #656d76; }
  .gee-sample-toolbar .stats b { color: #0969da; }
  .gee-sample-toolbar input,
  .gee-sample-toolbar select {
    padding: 7px 12px;
    border: 1px solid #d0d7de;
    border-radius: 4px;
    font-size: 13px;
    background: #fff;
  }
  .gee-sample-toolbar input:focus,
  .gee-sample-toolbar select:focus {
    outline: none;
    border-color: #0969da;
    box-shadow: 0 0 0 3px rgba(9,105,218,0.2);
  }
  
  /* GEE 示例卡片 */
  .sample-grid {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(380px, 1fr));
    gap: 14px;
  }
  .sample-card {
    background: #fff;
    border-radius: 6px;
    border: 1px solid #eaeef2;
    overflow: hidden;
    transition: box-shadow 0.15s;
  }
  .sample-card:hover { box-shadow: 0 2px 8px rgba(0,0,0,0.08); }
  .sample-header {
    padding: 10px 14px;
    border-bottom: 1px solid #eaeef2;
    display: flex;
    justify-content: space-between;
    align-items: center;
    background: #f6f8fa;
    flex-wrap: wrap;
    gap: 6px;
  }
  .sample-header .name {
    font-family: monospace;
    font-size: 13px;
    font-weight: 600;
    color: #0969da;
  }
  .sample-header .tags { display: flex; gap: 6px; align-items: center; }
  .sample-header .tag {
    font-size: 10px;
    padding: 2px 7px;
    border-radius: 10px;
    font-weight: 500;
  }
  .tag-source-example { color: #0969da; background: #ddf4ff; }
  .tag-source-generated { color: #8250df; background: #fbefff; }
  .sample-meta {
    padding: 6px 14px;
    background: #f6f8fa;
    font-size: 11px;
    color: #656d76;
    border-bottom: 1px solid #eaeef2;
  }
  pre.sample-code {
    background: #0d1117;
    color: #e6edf3;
    padding: 12px 14px;
    font-family: "SFMono-Regular", Consolas, monospace;
    font-size: 11px;
    line-height: 1.5;
    overflow-x: auto;
    max-height: 220px;
    overflow-y: auto;
    white-space: pre;
    margin: 0;
  }
  .sample-actions {
    padding: 8px 14px;
    border-top: 1px solid #eaeef2;
    display: flex;
    gap: 8px;
    background: #fff;
  }
  .sample-actions button {
    flex: 1;
    padding: 5px 10px;
    border: 1px solid #d0d7de;
    background: #fff;
    border-radius: 4px;
    cursor: pointer;
    font-size: 11px;
    transition: all 0.15s;
  }
  .sample-actions button:hover { background: #f6f8fa; }
  
  .pager { display: flex; gap: 8px; align-items: center; margin-top: 16px; justify-content: center; }
  .pager button {
    padding: 6px 14px;
    border: 1px solid #d0d7de;
    background: #fff;
    border-radius: 4px;
    cursor: pointer;
    font-size: 12px;
  }
  .pager button:hover:not(:disabled) { background: #f6f8fa; }
  .pager button:disabled { opacity: 0.4; cursor: not-allowed; }
  .pager .page-info { font-size: 12px; color: #656d76; }
  
  /* 视图基础样式 */
  .view { display: none; }
  .view.active { display: block; }
  
  /* 测试记录视图样式 */
  .test-record-view { display: none; }
  .test-record-view.active { display: block; }
  .record-toolbar {
    background: #fff;
    border-radius: 6px;
    padding: 14px 20px;
    margin-bottom: 16px;
    box-shadow: 0 1px 2px rgba(0,0,0,0.05);
    display: flex;
    gap: 12px;
    align-items: center;
    flex-wrap: wrap;
  }
  .record-toolbar .title {
    font-size: 16px;
    font-weight: 600;
    color: #1f2328;
    margin-right: auto;
  }
  .record-stats { display: flex; gap: 12px; font-size: 12px; color: #656d76; }
  .record-stats .stat-item b { color: #1f2328; }
  .record-stats .stat-item.success b { color: #1a7f37; }
  .record-stats .stat-item.fail b { color: #cf222e; }
  .record-toolbar select {
    padding: 7px 12px;
    border: 1px solid #d0d7de;
    border-radius: 4px;
    font-size: 13px;
    background: #fff;
  }
  .btn-clear {
    padding: 7px 12px;
    border: 1px solid #cf222e;
    background: #fff;
    color: #cf222e;
    border-radius: 4px;
    cursor: pointer;
    font-size: 12px;
    transition: all 0.15s;
  }
  .btn-clear:hover { background: #ffebe9; }
  
  /* 测试记录列表 */
  .record-list { display: flex; flex-direction: column; gap: 10px; }
  .record-item {
    background: #fff;
    border-radius: 6px;
    border: 1px solid #eaeef2;
    padding: 14px 18px;
    display: flex;
    justify-content: space-between;
    align-items: center;
    transition: all 0.15s;
    cursor: pointer;
  }
  .record-item:hover { 
    box-shadow: 0 2px 8px rgba(0,0,0,0.08);
    border-color: #d0d7de;
  }
  .record-item .record-left { flex: 1; min-width: 0; }
  .record-item .record-right { 
    display: flex; 
    flex-direction: column; 
    align-items: flex-end; 
    gap: 8px; 
    flex-shrink: 0;
  }
  .record-header {
    display: flex;
    align-items: center;
    gap: 10px;
    margin-bottom: 6px;
    flex-wrap: wrap;
  }
  .api-badge {
    display: inline-block;
    padding: 3px 10px;
    background: #ddf4ff;
    color: #0969da;
    border-radius: 4px;
    font-size: 13px;
    font-weight: 600;
    font-family: monospace;
  }
  .method-badge {
    display: inline-block;
    padding: 2px 8px;
    border-radius: 3px;
    font-size: 11px;
    font-weight: 600;
    font-family: monospace;
  }
  .method-badge.get { background: #dafbe1; color: #1a7f37; }
  .method-badge.post { background: #fff8c5; color: #9a6700; }
  .method-badge.put { background: #ddf4ff; color: #0969da; }
  .method-badge.delete { background: #ffebe9; color: #cf222e; }
  .path-text {
    font-size: 12px;
    color: #656d76;
    font-family: monospace;
  }
  .record-meta {
    font-size: 11px;
    color: #8b949e;
    display: flex;
    gap: 16px;
    margin-bottom: 4px;
  }
  .meta-item {
    white-space: nowrap;
  }
  .params-preview {
    font-size: 11px;
    color: #656d76;
    margin-top: 6px;
    padding: 6px 10px;
    background: #f6f8fa;
    border-radius: 4px;
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
  }
  .params-preview code {
    color: #1f2328;
    font-family: monospace;
  }
  .params-preview.input-preview {
    background: #ddf4ff;
    border-left: 3px solid #0969da;
    margin-top: 4px;
  }
  .params-preview.input-preview code {
    color: #0550ae;
  }
  .params-preview.output-preview {
    background: #dafbe1;
    border-left: 3px solid #1a7f37;
    margin-top: 2px;
  }
  .params-preview.output-preview code {
    color: #116329;
  }
  .record-actions {

/**
 * Toast 轻提示组件
 * @param {string} message - 提示消息
 * @param {'success'|'error'|'info'|'warning'} type - 提示类型
 * @param {number} duration - 显示时长(ms)，默认 2000
 */
function showToast(message, type = 'success', duration = 2000) {
  const container = document.getElementById('toast-container');
  const icons = {
    success: '✓',
    error: '✕',
    info: 'ℹ',
    warning: '⚠'
  };
  const toast = document.createElement('div');
  toast.className = 'toast-item toast-' + type;
  toast.innerHTML = '<span class="toast-icon">' + icons[type] + '</span>' + escapeHtml(message);
  container.appendChild(toast);
  requestAnimationFrame(() => toast.classList.add('show'));
  setTimeout(() => {
    toast.classList.remove('show');
    setTimeout(() => toast.remove(), 300);
  }, duration);
}

/**
 * 复制文本到剪贴板并显示 toast
 * @param {string} text - 要复制的文本
 * @param {string} successMsg - 成功提示消息
 */
function copyToClipboard(text, successMsg = '已复制到剪贴板') {
  navigator.clipboard.writeText(text).then(() => {
    showToast(successMsg, 'success');
  }).catch(() => {
    // 降级方案
    const ta = document.createElement('textarea');
    ta.value = text;
    document.body.appendChild(ta);
    ta.select();
    try {
      document.execCommand('copy');
      showToast(successMsg, 'success');
    } catch (e) {
      showToast('复制失败', 'error');
    }
    document.body.removeChild(ta);
  });
}

function renderApiList() {
  const list = document.getElementById('api-list');

  API_DEFS.forEach(api => {

  Object.keys(groups).forEach(groupName => {
    html += `<div class="group-title">${groupName}</div>`;

      html += `

/* ============================================================
 * 渲染单个参数字段（含类型标签）
 * ============================================================ */
function renderParamField(param, api) {
  const label = param.required ? `${param.label} <span class="req">*</span>` : param.label;
  const hint = param.hint || '';
  const placeholder = param.placeholder || '';
  const typeTag = param.valueType ? `<span class="type-tag">${param.valueType}</span>` : '';
  let field = '';
  const id = `param-${api.id}-${param.key}`;

  if (param.type === 'textarea') {
    field = `<textarea id="${id}" placeholder="${placeholder}" class="${param.class || ''}">${param.default || ''}</textarea>`;
  } else if (param.type === 'select') {
    const opts = param.options.map(([v, l]) =>
      `<option value="${v}" ${v === param.default ? 'selected' : ''}>${l}</option>`
    ).join('');
    field = `<select id="${id}">${opts}</select>`;
  } else if (param.type === 'number') {
    field = `<input id="${id}" type="number" value="${param.default}" placeholder="${placeholder}">`;
  } else {
    field = `<input id="${id}" type="text" value="${param.default || ''}" placeholder="${placeholder}">`;
  }
  return `<div class="param-field">
    <label for="${id}">${label}${typeTag}</label>
    ${field}
    <div class="hint">${hint}</div>
  </div>`;
}

/* ============================================================
 * 构造完整 URL 预览
 * ============================================================ */
function buildFullUrl(api, preview) {
  const base = window.location.origin;
  if (api.method === 'POST') {
    return `${base}${api.path}`;
  }
  const params = getParams(api);
  let path = api.path;
  api.params.forEach(p => {
    if (path.includes(`<${p.key}>`)) {
      const val = params[p.key] ?? '';
      path = path.replace(`<${p.key}>`, encodeURIComponent(val));
    }
  });
  const queryParts = [];
  Object.keys(params).forEach(k => {
    if (!api.path.includes(`<${k}>`) && params[k] !== '' && params[k] !== undefined) {
      queryParts.push(`${encodeURIComponent(k)}=${encodeURIComponent(params[k])}`);
    }
  });
  return `${base}${path}${queryParts.length ? '?' + queryParts.join('&') : ''}`;
}

function updateUrlPreview(api) {
  const el = document.getElementById('full-url');
  if (el) el.textContent = buildFullUrl(api, true);
}

/* ============================================================
 * 收集当前接口的参数值
 * ============================================================ */
function getParams(api) {
  const params = {};
  api.params.forEach(p => {
    const id = `param-${api.id}-${p.key}`;
    const el = document.getElementById(id);
    if (el) {
      params[p.key] = el.value;
    }
  });
  return params;
}

/* ============================================================
 * 发送请求
 * ============================================================ */
async function sendRequest(apiId) {
  const api = API_DEFS.find(a => a.id === apiId);
  if (!api) return;

  const params = getParams(api);
  const requiredMissing = [];
  api.params.forEach(p => {
    if (p.required && (params[p.key] === '' || params[p.key] === undefined)) {
      requiredMissing.push(p.key);
    }
  });
  if (requiredMissing.length > 0) {
    alert(`请填写必填参数：${requiredMissing.join(', ')}`);
    return;
  }

  const respSec = document.getElementById('response-section');
  respSec.style.display = 'block';
  document.getElementById('response-body').textContent = '⏳ 请求进行中...';
  document.getElementById('status-badge').textContent = '';
  document.getElementById('status-badge').className = '';
  document.getElementById('response-time').textContent = '';

  const startTime = Date.now();
  const requestTime = new Date().toISOString();
  let url = api.path;
  const body = {};

  if (api.method === 'GET') {
    Object.keys(params).forEach(k => {
      if (url.includes(`<${k}>`)) {
        url = url.replace(`<${k}>`, encodeURIComponent(params[k]));
      }
    });
    const queryParts = [];
    Object.keys(params).forEach(k => {
      if (!url.includes(`<${k}>`) && params[k] !== '' && params[k] !== undefined) {
        queryParts.push(`${encodeURIComponent(k)}=${encodeURIComponent(params[k])}`);
      }
    });
    if (queryParts.length > 0) url += '?' + queryParts.join('&');
  } else {
    Object.keys(params).forEach(k => {
      body[k] = params[k];
    });
  }

  // 保存请求参数
  const requestParamsStr = JSON.stringify(api.method === 'GET' ? params : body);

  try {
    const fetchOpts = {
      method: api.method,
      headers: { 'Content-Type': 'application/json' }
    };
    if (api.method === 'POST') {
      fetchOpts.body = JSON.stringify(body);
    }
    const res = await fetch(url, fetchOpts);
    const elapsed = Date.now() - startTime;
    const text = await res.text();
    let data;
    try { data = JSON.parse(text); } catch { data = text; }

    const statusBadge = document.getElementById('status-badge');
    statusBadge.textContent = `${res.status} ${res.statusText}`;
    if (res.ok) {
      statusBadge.className = 'status-badge status-ok';
    } else if (res.status >= 500) {
      statusBadge.className = 'status-badge status-err';
    } else {
      statusBadge.className = 'status-badge status-warn';
    }
    
    // 优先使用后端返回的 timing 信息，否则使用前端计时
    let displayTime = `${elapsed} ms`;
    if (typeof data === 'object' && data.timing && data.timing.api_total) {
      displayTime = `⏱ ${(data.timing.api_total * 1000).toFixed(1)}ms (接口内)`;
    } else if (typeof data === 'object' && data.result && data.result.timing && data.result.timing.api_total) {
      displayTime = `⏱ ${(data.result.timing.api_total * 1000).toFixed(1)}ms (接口内)`;
    }
    document.getElementById('response-time').textContent = displayTime;

    const bodyEl = document.getElementById('response-body');
    if (typeof data === 'object') {
      bodyEl.textContent = JSON.stringify(data, null, 2);
    } else {
      bodyEl.textContent = text;
    }

    // 对于 convert 和 convert-llm 接口，显示美化视图按钮并添加到缓存
    const prettyBtn = document.querySelector('.pretty-view-btn');
    const prettyContainer = document.getElementById('pretty-view-container');
    if (apiId === 'convert' || apiId === 'convert-llm') {
      if (data && data.success && data.result) {
        // 存储数据供美化视图使用（同时保存原始输入的 GEE 代码）
        window._lastConvertResult = data;
        window._lastConvertResult._inputGeeCode = params.gee_code || '';
        prettyBtn.style.display = 'inline-block';
        prettyContainer.style.display = 'none';
        
        // 将单次查询结果添加到缓存
        const geeCode = params.gee_code || '';
        if (geeCode.trim()) {
          const cacheKey = _geeHash(geeCode);
          if (!window._resultCache[cacheKey]) {
            window._resultCache[cacheKey] = { gee_code: geeCode, results: [] };
          }
          const step6 = data.result.step6 || {};
          const ogeCode = step6.oge_code || data.result.llm_oge_code || '';
          const feasibility = step6.feasibility || 'unknown';
          window._resultCache[cacheKey].results.push({
            id: Date.now() + '_' + Math.random().toString(36).substr(2, 6),
            timestamp: new Date().toLocaleString('zh-CN'),
            oge_code: ogeCode,
            feasibility: feasibility,
            engine: data.engine || (apiId === 'convert-llm' ? 'llm_enhanced' : 'rule_engine'),
            elapsed_ms: elapsed,
            full_result: data.result
          });
          // 更新缓存徽章和面板
          updateCacheBadge();
          renderCachePanel();
          saveCacheToBackend();
        }
      }
    } else {
      prettyBtn.style.display = 'none';
      prettyContainer.style.display = 'none';
    }

    // 保存测试记录
    await saveTestRecord({
      api_id: apiId,
      api_path: api.path,
      method: api.method,
      request_params: requestParamsStr,
      request_time: requestTime,
      status_code: res.status,
      response_time: elapsed,
      response_body: text,
      success: res.ok ? 1 : 0,
      error_message: ''
    });
    
    // 实时刷新测试记录列表
    if (currentView === 'record') {
      loadTestRecords();
    }

  } catch (err) {
    const elapsed = Date.now() - startTime;
    document.getElementById('status-badge').textContent = 'ERROR';
    document.getElementById('status-badge').className = 'status-badge status-err';
    document.getElementById('response-time').textContent = `${elapsed} ms`;
    document.getElementById('response-body').textContent = `请求失败: ${err.message}`;

    // 保存测试记录（失败）
    await saveTestRecord({
      api_id: apiId,
      api_path: api.path,
      method: api.method,
      request_params: requestParamsStr,
      request_time: requestTime,
      status_code: 0,
      response_time: elapsed,
      response_body: '',
      success: 0,
      error_message: err.message
    });
  }
}

/* ============================================================
 * HTML 转义
 * ============================================================ */
function escapeHtml(str) {
  if (str == null) return '';
  return String(str)
    .replace(/&/g, '&amp;')
    .replace(/</g, '&lt;')
    .replace(/>/g, '&gt;');
}

/**
 * 格式化输入类型为可读字符串
 */
function formatInputTypes(inputTypes) {
  if (!inputTypes) return '';
  if (Array.isArray(inputTypes)) {
    return inputTypes.map(t => escapeHtml(t)).join(', ');
  }
  if (typeof inputTypes === 'string') {
    try {
      const parsed = JSON.parse(inputTypes);
      if (Array.isArray(parsed)) {
        return parsed.map(t => escapeHtml(t)).join(', ');
      }
    } catch (e) {
      return escapeHtml(inputTypes);
    }
  }
  return escapeHtml(String(inputTypes));
}

      copyCodeText(code);

/* ============================================================
 * 测试记录视图逻辑
 * ============================================================ */
let recordPage = 1;
const RECORD_PER_PAGE = 15;

async function initTestRecords() {
  // 初始化接口筛选器
  const apiFilter = document.getElementById('record-api-filter');
  const apiOptions = [['', '全部接口']];
  API_DEFS.forEach(api => {
    apiOptions.push([api.id, `${api.id} (${api.path})`]);
  });
  apiFilter.innerHTML = apiOptions.map(([v, l]) => 
    `<option value="${v}">${l}</option>`
  ).join('');
  
  // 加载统计信息
  await loadRecordStats();
  
  // 加载记录
  recordPage = 1;
  await loadTestRecords();
}

async function loadRecordStats() {
  try {
    const res = await fetch('/api/test-records/stats');
    const data = await res.json();
    
    if (data.success) {
      document.getElementById('record-total').textContent = data.data.total;
      document.getElementById('record-success').textContent = data.data.success_count;
      document.getElementById('record-fail').textContent = data.data.fail_count;
    }
  } catch (e) {
    console.error('加载统计失败:', e);
  }
}

async function loadTestRecords() {
  const successFilter = document.getElementById('record-filter').value;
  const apiFilter = document.getElementById('record-api-filter').value;
  
  const params = new URLSearchParams({
    page: recordPage,
    per_page: RECORD_PER_PAGE
  });
  if (successFilter) params.set('success', successFilter);
  if (apiFilter) params.set('api_id', apiFilter);
  
  const url = `/api/test-records?${params.toString()}`;
  
  try {
    const res = await fetch(url);
    const data = await res.json();
    
    if (data.success) {
      renderRecordList(data.data);
      document.getElementById('record-page-info').textContent = 
        `第 ${recordPage} 页 / 共 ${Math.ceil(data.total / RECORD_PER_PAGE)} 页`;
      
      // 更新分页按钮状态
      document.querySelector('#record-pager button[onclick="changeRecordPage(-1)"]').disabled = recordPage <= 1;
      document.querySelector('#record-pager button[onclick="changeRecordPage(1)"]').disabled = recordPage >= Math.ceil(data.total / RECORD_PER_PAGE);
    }
  } catch (err) {
    console.error('加载测试记录失败:', err);
    document.getElementById('record-list').innerHTML = 
      '<div class="empty-hint">加载失败，请检查后端服务是否启动</div>';
  }
}

function changeRecordPage(delta) {
  const newPage = recordPage + delta;
  if (newPage < 1) return;
  recordPage = newPage;
  loadTestRecords();
}

function renderRecordList(records) {
  const list = document.getElementById('record-list');
  
  if (!records || records.length === 0) {
    list.innerHTML = '<div class="empty-hint">暂无测试记录</div>';
    return;
  }
  
  list.innerHTML = records.map(r => {
    // 解析请求参数，提取关键信息
    let inputPreview = '';
    try {
      if (r.request_params) {
        const params = JSON.parse(r.request_params);
        if (params.gee_code) {
          const codePreview = params.gee_code.substring(0, 60);
          inputPreview = `<div class="params-preview input-preview">📥 输入: <code>${escapeHtml(codePreview)}${params.gee_code.length > 60 ? '...' : ''}</code></div>`;
        } else if (params.keyword) {
          inputPreview = `<div class="params-preview input-preview">📥 输入: <code>${escapeHtml(params.keyword)}</code></div>`;
        } else {
          const keys = Object.keys(params);
          if (keys.length > 0) {
            inputPreview = `<div class="params-preview input-preview">📥 输入: <code>${escapeHtml(keys.slice(0, 3).join(', '))}${keys.length > 3 ? '...' : ''}</code></div>`;
          }
        }
      }
    } catch (e) {
      inputPreview = '';
    }
    
    // 解析响应结果，提取关键信息
    let outputPreview = '';
    try {
      if (r.response_body) {
        const body = typeof r.response_body === 'string' ? JSON.parse(r.response_body) : r.response_body;
        if (body.success !== undefined) {
          // 转换接口结果摘要
          if (body.result && body.result.step1) {
            const step1 = body.result.step1;
            let summary = '';
            if (step1.task_goal) summary += step1.task_goal.substring(0, 40);
            if (body.matching_rate !== undefined) summary += ` | 匹配率: ${(body.matching_rate * 100).toFixed(1)}%`;
            outputPreview = `<div class="params-preview output-preview">📤 输出: <code>${escapeHtml(summary || '转换完成')}</code></div>`;
          } else {
            // 其他接口结果摘要
            let summary = body.success ? '成功' : '失败';
            if (body.total !== undefined) summary += ` | 共 ${body.total} 条`;
            if (body.count !== undefined) summary += ` | 计数: ${body.count}`;
            outputPreview = `<div class="params-preview output-preview">📤 输出: <code>${escapeHtml(summary)}</code></div>`;
          }
        }
      }
    } catch (e) {
      // 非JSON响应，截取前60字符
      if (r.response_body) {
        const text = typeof r.response_body === 'string' ? r.response_body.substring(0, 60) : '';
        if (text) {
          outputPreview = `<div class="params-preview output-preview">📤 输出: <code>${escapeHtml(text)}${r.response_body.length > 60 ? '...' : ''}</code></div>`;
        }
      }
    }
    
    return `
      <div class="record-item" onclick="viewRecordDetail(${r.id})">
        <div class="record-left">
          <div class="record-header">
            <span class="api-badge">${escapeHtml(r.api_id)}</span>
            <span class="method-badge ${r.method.toLowerCase()}">${escapeHtml(r.method)}</span>
            <span class="path-text">${escapeHtml(r.api_path)}</span>
          </div>
          <div class="record-meta">
            <span class="meta-item">🕐 ${formatTime(r.request_time)}</span>
            <span class="meta-item">⏱️ ${r.response_time} ms</span>
            <span class="meta-item">📊 ${r.status_code || 'N/A'}</span>
          </div>
          ${inputPreview}
          ${outputPreview}
        </div>
        <div class="record-right">
          <span class="status-badge ${r.success ? 'success' : 'fail'}">
            ${r.success ? '✅ 成功' : '❌ 失败'}
          </span>
          <div class="record-actions">
            <button class="btn-detail" onclick="event.stopPropagation(); viewRecordDetail(${r.id})">详情</button>
            <button class="btn-delete" onclick="event.stopPropagation(); deleteRecord(${r.id})">删除</button>
          </div>
        </div>
      </div>
    `;
  }).join('');
}

function formatTime(isoStr) {
  if (!isoStr) return 'N/A';
  const d = new Date(isoStr);
  return d.toLocaleString('zh-CN', {
    year: 'numeric',
    month: '2-digit',
    day: '2-digit',
    hour: '2-digit',
    minute: '2-digit',
    second: '2-digit'
  });
}

async function viewRecordDetail(recordId) {
  try {
    const res = await fetch(`/api/test-records/${recordId}`);
    const result = await res.json();
    
    if (result.success) {
      const r = result.data;

      if (r.request_params) {
        try {
          const params = JSON.parse(r.request_params);
          requestParamsFormatted = JSON.stringify(params, null, 2);
        } catch (e) {
          requestParamsFormatted = r.request_params;
        }
      }
      
      // 格式化响应体（JSON 格式化）
      let responseBodyFormatted = '无响应';
      if (r.response_body) {
        try {
          const body = JSON.parse(r.response_body);
          responseBodyFormatted = JSON.stringify(body, null, 2);
        } catch (e) {
          responseBodyFormatted = r.response_body;
        }
      }
      
      // 使用模态框显示详情
      document.getElementById('detail-title').textContent = `📋 测试记录详情 #${r.id}`;
      document.getElementById('detail-content').innerHTML = `
        <div class="detail-section">
          <h4>基本信息</h4>
          <div class="detail-row">
            <span class="label">接口:</span>
            <span class="value">
              <span class="method-badge ${r.method.toLowerCase()}">${escapeHtml(r.method)}</span>
              ${escapeHtml(r.api_id)}
            </span>
          </div>
          <div class="detail-row">
            <span class="label">路径:</span>
            <span class="value" style="font-family: monospace;">${escapeHtml(r.api_path)}</span>
          </div>
          <div class="detail-row">
            <span class="label">状态:</span>
            <span class="value">
              <span class="status-badge ${r.success ? 'success' : 'fail'}">${r.success ? '✅ 成功' : '❌ 失败'}</span>
            </span>
          </div>
          <div class="detail-row">
            <span class="label">状态码:</span>
            <span class="value">${r.status_code || 'N/A'}</span>
          </div>
          <div class="detail-row">
            <span class="label">耗时:</span>
            <span class="value">${r.response_time} ms</span>
          </div>
          <div class="detail-row">
            <span class="label">请求时间:</span>
            <span class="value">${formatTime(r.request_time)}</span>
          </div>
        </div>
        
        <div class="detail-section">
          <h4>请求参数</h4>
          <pre class="detail-code" style="max-height: 200px; overflow-y: auto;">${escapeHtml(requestParamsFormatted)}</pre>
        </div>
        
        <div class="detail-section">
          <h4>响应结果</h4>
          <pre class="detail-code" style="max-height: 300px; overflow-y: auto;">${escapeHtml(responseBodyFormatted)}</pre>
        </div>
        
        ${r.error_message ? `
        <div class="detail-section" style="background: #ffebe9; border: 1px solid #ffcecb;">
          <h4 style="color: #cf222e;">错误信息</h4>
          <pre class="detail-code" style="color: #cf222e;">${escapeHtml(r.error_message)}</pre>
        </div>
        ` : ''}
      `;
      
      document.getElementById('detail-modal').style.display = 'flex';
    }
  } catch (e) {
    alert('获取详情失败: ' + e.message);
  }
}

async function deleteRecord(recordId) {
  if (!confirm('确定要删除这条测试记录吗？')) return;
  
  try {
    await fetch(`/api/test-records/${recordId}`, { method: 'DELETE' });
    await loadTestRecords();
    await loadRecordStats();
  } catch (e) {
    alert('删除失败: ' + e.message);
  }
}

async function clearAllRecords() {
  if (!confirm('确定要清空所有测试记录吗？此操作不可恢复！')) return;
  
  try {
    await fetch('/api/test-records/clear', { method: 'POST' });
    await loadTestRecords();
    await loadRecordStats();
    alert('已清空所有测试记录');
  } catch (e) {
    alert('清空失败: ' + e.message);
  }
}

/**

function togglePrettyView() {
  const container = document.getElementById('pretty-view-container');
  const bodyEl = document.getElementById('response-body');

  if (!container || !bodyEl) return;

  if (container.style.display === 'none') {
    // 显示美化视图
    if (!window._lastConvertResult || !window._lastConvertResult.result) {
      showToast('请先执行代码转换', 'warning');
      return;
    }
    try {
      renderPrettyView();
      container.style.display = 'block';
      bodyEl.style.display = 'none';
    } catch (err) {
      console.error('[美化视图] 渲染失败:', err);
      showToast('美化视图渲染失败: ' + err.message, 'error');
    }
  } else {
    // 显示原始JSON
    container.style.display = 'none';
    bodyEl.style.display = 'block';
  }
}

/**
 * 格式化关键参数的显示
 */
function formatKeyParamsDisplay(keyParams) {
  if (!keyParams || Object.keys(keyParams).length === 0) {
    return '<span style="color: #8b949e;">未提取到关键参数</span>';
  }
  
  const sections = [];
  
  // 定义参数类型的标签和图标
  const paramMeta = {
    datasets: { label: '数据源', icon: '📦', color: '#0969da' },
    bands: { label: '波段', icon: '🎵', color: '#8250df' },
    indices: { label: '指数', icon: '📊', color: '#1a7f37' },
    geometry_points: { label: '地理坐标', icon: '📍', color: '#bf8700' },
    map_center: { label: '地图中心', icon: '🗺️', color: '#bf8700' },
    dates: { label: '日期', icon: '📅', color: '#bc4c00' },
    date_filters: { label: '日期过滤', icon: '⏰', color: '#bc4c00' },
    properties: { label: '属性', icon: '🏷️', color: '#0550ae' },
    operations: { label: '操作', icon: '⚙️', color: '#1f2328' },
    variable_definitions: { label: '变量定义', icon: '📝', color: '#656d76' },
    note: { label: '说明', icon: '💡', color: '#656d76' },
    coordinates: { label: '坐标', icon: '📍', color: '#bf8700' },
    filters: { label: '过滤条件', icon: '🔍', color: '#bc4c00' },
    other: { label: '其他参数', icon: '📌', color: '#656d76' }
  };
  
  for (const [key, value] of Object.entries(keyParams)) {
    if (key === 'note') continue;  // note 单独处理
    
    const meta = paramMeta[key] || { label: key, icon: '📌', color: '#656d76' };
    let displayValue = '';
    
    if (Array.isArray(value)) {
      if (value.length === 0) continue;
      
      // 特殊处理：坐标数组
      if (key === 'geometry_points' || key === 'coordinates') {
        displayValue = value.map((p, i) => {
          if (typeof p === 'object' && p.lng !== undefined) {
            return `<span style="display:inline-block;padding:2px 8px;margin:2px;background:#fff8c5;border-radius:4px;font-size:11px;">点${i+1}: ${p.lng}, ${p.lat}</span>`;
          }
          return `<span style="display:inline-block;padding:2px 8px;margin:2px;background:#fff8c5;border-radius:4px;font-size:11px;">${escapeHtml(String(p))}</span>`;
        }).join('');
      } else if (key === 'properties') {
        displayValue = value.map((p, i) => {
          if (typeof p === 'object') {
            return `<span style="display:inline-block;padding:2px 8px;margin:2px;background:#ddf4ff;border-radius:4px;font-size:11px;">${escapeHtml(p.key)}: ${escapeHtml(p.value)}</span>`;
          }
          return escapeHtml(String(p));
        }).join('');
      } else if (key === 'date_filters') {
        displayValue = value.map((p, i) => {
          if (typeof p === 'object') {
            return `<span style="display:inline-block;padding:2px 8px;margin:2px;background:#ffebe9;border-radius:4px;font-size:11px;color:#cf222e;">${escapeHtml(p.start)} ~ ${escapeHtml(p.end)}</span>`;
          }
          return escapeHtml(String(p));
        }).join('');
      } else if (key === 'variable_definitions') {
        displayValue = value.map((p, i) => {
          if (typeof p === 'object') {
            return `<span style="display:inline-block;padding:2px 8px;margin:2px;background:#dcfce7;border-radius:4px;font-size:11px;color:#166534;">${escapeHtml(p.variable)}: ${escapeHtml(p.type)}</span>`;
          }
          return escapeHtml(String(p));
        }).join('');
      } else {
        displayValue = value.map(v => 
          `<span style="display:inline-block;padding:2px 8px;margin:2px;background:${key==='dates'?'#fff8c5':'#ddf4ff'};border-radius:4px;font-size:11px;">${escapeHtml(typeof v === 'object' ? JSON.stringify(v) : String(v))}</span>`
        ).join('');
      }
    } else if (typeof value === 'object' && value !== null) {
      if (key === 'map_center') {
        displayValue = `<span style="font-size:12px;">经度: ${value.lng}, 纬度: ${value.lat}, 缩放: ${value.zoom}</span>`;
      } else if (key === 'other') {
        displayValue = Object.entries(value).map(([k, v]) => 
          `<div style="display:flex;margin:2px 0;"><span style="color:#656d76;font-size:11px;min-width:80px;">${escapeHtml(k)}:</span><span style="font-size:11px;">${escapeHtml(typeof v === 'object' ? JSON.stringify(v) : String(v))}</span></div>`
        ).join('');
      } else {
        displayValue = escapeHtml(JSON.stringify(value));
      }
    } else {
      displayValue = `<span style="font-size:12px;">${escapeHtml(String(value))}</span>`;
    }
    
    sections.push(`
      <div style="margin-bottom:8px;">
        <div style="font-size:12px;color:${meta.color};font-weight:600;margin-bottom:3px;">${meta.icon} ${meta.label}</div>
        <div>${displayValue}</div>
      </div>
    `);
  }
  
  // 添加 note（如果有）
  if (keyParams.note) {
    sections.push(`
      <div style="margin-top:8px;padding:8px;background:#f6f8fa;border-radius:4px;font-size:11px;color:#656d76;">
        💡 ${escapeHtml(keyParams.note)}
      </div>
    `);
  }
  
  return sections.join('');
}

/**
 * 切换美化视图标签
 */
function switchPrettyTab(event, tabName) {
  event.stopPropagation();
  document.querySelectorAll('.pretty-tab').forEach(t => t.classList.remove('active'));
  document.querySelectorAll('.pretty-tab-content').forEach(t => t.classList.remove('active'));
  event.target.classList.add('active');
  document.getElementById(`tab-${tabName}`).classList.add('active');
}

/**
 * 删除 GEE 代码中的所有注释（单行注释和多行块注释），保留代码主体
 * @param {string} code - 原始 GEE 代码
 * @returns {string} 删除注释后的代码
 */
function stripGeeComments(code) {
  if (!code) return '';
  let result = '';
  let i = 0;
  const len = code.length;
  let inString = false;
  let stringChar = null;
  while (i < len) {
    const ch = code[i];
    const nextCh = code[i + 1];
    // 处理字符串字面量（避免误删字符串内的 // 和 /*）
    if (!inString && (ch === "'" || ch === '"' || ch === '`')) {
      inString = true;
      stringChar = ch;
      result += ch;
      i++;
      continue;
    }
    if (inString) {
      // 遇到转义字符，跳过下一字符
      if (ch === '\\') {
        result += ch + (nextCh || '');
        i += 2;
        continue;
      }
      if (ch === stringChar) {
        inString = false;
        stringChar = null;
      }
      result += ch;
      i++;
      continue;
    }
    // 单行注释 //
    if (ch === '/' && nextCh === '/') {
      // 跳过到行尾
      while (i < len && code[i] !== '\n') i++;
      continue;
    }
    // 多行注释 /* */
    if (ch === '/' && nextCh === '*') {
      i += 2;
      while (i < len && !(code[i] === '*' && code[i + 1] === '/')) i++;
      i += 2; // 跳过结尾的 */
      continue;
    }
    result += ch;
    i++;
  }
  // 清理多余空行（连续空行压缩为单个空行，首尾去空白）
  const lines = result.split('\n');
  const cleanedLines = [];
  let prevBlank = false;
  for (const line of lines) {
    const trimmed = line.trim();
    if (trimmed === '') {
      if (!prevBlank && cleanedLines.length > 0) {
        cleanedLines.push('');
      }
      prevBlank = true;
    } else {
      cleanedLines.push(line);
      prevBlank = false;
    }
  }
  // 去除尾部空行
  while (cleanedLines.length > 0 && cleanedLines[cleanedLines.length - 1] === '') {
    cleanedLines.pop();
  }
  return cleanedLines.join('\n');
}

/**
 * 渲染原始 GEE 代码（删除注释后展示）
 * @param {string} geeCode - 原始 GEE 代码
 * @returns {string} HTML 字符串
 */
function renderGeeCode(geeCode) {
  if (!geeCode || !geeCode.trim()) {
    return '<div class="empty-hint">未提供原始 GEE 代码</div>';
  }
  const cleanedCode = stripGeeComments(geeCode);
  const originalLines = geeCode.split('\n').length;
  const cleanedLines = cleanedCode.split('\n').length;
  return `
    <div style="margin-bottom: 12px; padding: 10px 14px; background: #fff8c5; border-radius: 6px; display: flex; justify-content: space-between; align-items: center;">
      <span style="font-size: 13px;"><strong>📄 原 GEE 代码</strong>（已删除注释）</span>
      <span style="font-size: 12px; color: #656d76;">原始 ${originalLines} 行 → 清理后 ${cleanedLines} 行</span>
    </div>
    <div class="code-block">${escapeHtml(cleanedCode)}</div>
    <div style="margin-top: 8px; display: flex; gap: 8px;">
      <button class="btn btn-secondary btn-sm" onclick="copyGeeCode()">📋 复制代码</button>
    </div>
  `;
}

/**
 * 复制原始 GEE 代码（已删除注释）
 */
function copyGeeCode() {
  const data = window._lastConvertResult;
  if (!data || !data._inputGeeCode) { showToast('无可复制的代码', 'warning'); return; }
  const cleanedCode = stripGeeComments(data._inputGeeCode);
  copyToClipboard(cleanedCode, '代码已复制到剪贴板');
}

 */
function copyOgeCode() {
  const data = window._lastConvertResult;

  const code = r.llm_oge_code || r.step6?.oge_code || '';

}

/**
 * 下载 OGE 代码
 */
function downloadOgeCode() {
  const data = window._lastConvertResult;
  if (!data) return;
  const r = data.result;
  const code = r.llm_oge_code || r.step6?.oge_code || '';
  if (!code) { alert('无可下载的代码'); return; }
  const blob = new Blob([code], { type: 'text/plain' });
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url;
  a.download = 'oge_workflow.py';
  a.click();
  URL.revokeObjectURL(url);
}

/**
 * 渲染缺失报告
 */
function renderMissingReport(r) {
  const blocking = r.step5?.blocking_apis || [];
  const nonBlocking = r.step5?.non_blocking_gaps || [];
  const suggestions = r.step5?.rescue_suggestions || [];
  
  if (blocking.length === 0 && nonBlocking.length === 0) {
    return '<div class="empty-hint">✅ 无缺失 API，转换完全可行！</div>';
  }
  
  let html = '';
  
  if (blocking.length > 0) {
    html += `
      <div class="missing-section blocking">
        <div class="missing-title" style="color: #cf222e;">🚫 阻断性缺失 (${blocking.length} 个)</div>
        <div>${blocking.map(a => `<span class="api-chip" style="background: #ffebe9; color: #cf222e;">${escapeHtml(a)}</span>`).join('')}</div>
      </div>
    `;
  }
  
  if (nonBlocking.length > 0) {
    html += `
      <div class="missing-section non-blocking">
        <div class="missing-title" style="color: #9a6700;">⚠️ 非阻断性缺失 (${nonBlocking.length} 个)</div>
        <div>${nonBlocking.map(a => `<span class="api-chip" style="background: #fff8c5; color: #9a6700;">${escapeHtml(a)}</span>`).join('')}</div>
      </div>
    `;
  }
  
  if (suggestions.length > 0) {
    html += `
      <div style="margin-top: 12px;">
        <strong style="font-size: 13px;">💡 修复建议:</strong>
        <ul class="suggestion-list">
          ${suggestions.map(s => `
            <li>
              <code>${escapeHtml(s.api)}</code>
              <span>${escapeHtml(s.suggestion)}</span>
            </li>
          `).join('')}
        </ul>
      </div>
    `;
  }
  
  return html;
}
</script>

<script>
/**
 * 结果缓存管理
 * 数据结构: window._resultCache = { [geeHash]: { gee_code, results: [] } }
 * 每个 result: { id, timestamp, oge_code, feasibility, engine, elapsed_ms }
 */
window._resultCache = {};
let _batchRunning = false;

/**
 * 生成 GEE 代码的哈希键（取前50字符 + 长度，避免过长的 key）
 */
function _geeHash(code) {
  const trimmed = code.trim();
  return trimmed.substring(0, 50).replace(/\s+/g, ' ') + '...[' + trimmed.length + ']';
}

/**
 * 保存缓存到后端文件（防抖）
 */
let _saveCacheTimer = null;
function saveCacheToBackend() {
  if (_saveCacheTimer) clearTimeout(_saveCacheTimer);
  _saveCacheTimer = setTimeout(async () => {
    try {
      await fetch('/api/result-cache', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify(window._resultCache)
      });
    } catch (e) {
      console.error('[Cache] 保存失败:', e);
    }
  }, 500);
}

/**
 * 从后端加载缓存
 */
async function loadCacheFromBackend() {
  try {
    const resp = await fetch('/api/result-cache');
    const data = await resp.json();
    if (data.success && data.cache) {
      window._resultCache = data.cache;
      updateCacheBadge();
      // 如果缓存面板已打开，刷新展示
      const panel = document.getElementById('cache-panel');
      if (panel && panel.classList.contains('open')) {
        renderCachePanel();
      }
    }
  } catch (e) {
    console.error('[Cache] 加载失败:', e);
  }
}

// 页面加载时恢复缓存
window.addEventListener('DOMContentLoaded', loadCacheFromBackend);

/**
 * 批量调用 convert-llm（从输入框读取自定义次数）
 */
async function batchConvertLlm() {
  if (_batchRunning) {
    showToast('批量生成正在进行中，请等待完成', 'warning');
    return;
  }

  // 从输入框读取自定义次数
  const timesInput = document.getElementById('batch-times-input');
  let times = 3;
  if (timesInput) {
    times = parseInt(timesInput.value) || 3;
    if (times < 1) times = 1;
    if (times > 20) {
      times = 20;
      timesInput.value = 20;
      showToast('最多支持20次，已自动调整', 'warning');
    }
  }

  const api = API_DEFS.find(a => a.id === 'convert-llm');
  if (!api) return;

  const params = getParams(api);
  if (!params.gee_code || !params.gee_code.trim()) {
    alert('请先填写 GEE 代码');
    return;
  }

  _batchRunning = true;
  const btn = document.getElementById('batch-btn');
  const originalText = btn ? btn.textContent : '';
  if (btn) { btn.disabled = true; btn.textContent = '⏳ 生成中...'; }

  // 显示进度条
  const respSec = document.getElementById('response-section');
  if (respSec) respSec.style.display = 'block';
  const bodyEl = document.getElementById('response-body');

  const geeCode = params.gee_code;
  const cacheKey = _geeHash(geeCode);

  // 初始化缓存组
  if (!window._resultCache[cacheKey]) {
    window._resultCache[cacheKey] = { gee_code: geeCode, results: [] };
  }

  for (let i = 0; i < times; i++) {
    if (bodyEl) {
      bodyEl.innerHTML = '<div class="batch-progress show">' +
        '<span>批量生成 ' + (i + 1) + '/' + times + '</span>' +
        '<div class="batch-progress-bar"><div class="batch-progress-fill" style="width:' +
        ((i / times) * 100) + '%"></div></div></div>' +
        '<pre style="margin-top:8px;">⏳ 第 ' + (i + 1) + ' 次调用 convert-llm...</pre>';
    }

    const startTime = Date.now();
    try {
      const res = await fetch('/api/convert-llm', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ gee_code: geeCode, case_name: params.case_name || '批量生成' })
      });
      const elapsed = Date.now() - startTime;
      const data = await res.json();

      if (data.success && data.result) {
        const step6 = data.result.step6 || {};
        const ogeCode = step6.oge_code || data.result.llm_oge_code || '';
        const feasibility = step6.feasibility || 'unknown';

        window._resultCache[cacheKey].results.push({
          id: Date.now() + '_' + Math.random().toString(36).substr(2, 6),
          timestamp: new Date().toLocaleString('zh-CN'),
          oge_code: ogeCode,
          feasibility: feasibility,
          engine: data.engine || 'llm_enhanced',
          elapsed_ms: elapsed,
          full_result: data.result
        });
      }
    } catch (e) {
      console.error('Batch call error:', e);
    }

    // 更新进度条
    if (bodyEl) {
      const progress = ((i + 1) / times) * 100;
      bodyEl.innerHTML = '<div class="batch-progress show">' +
        '<span>批量生成 ' + (i + 1) + '/' + times + '</span>' +
        '<div class="batch-progress-bar"><div class="batch-progress-fill" style="width:' +
        progress + '%"></div></div></div>';
    }
  }

  // 完成
  _batchRunning = false;
  if (btn) { btn.disabled = false; btn.textContent = originalText; }

  const totalCount = window._resultCache[cacheKey].results.length;
  if (bodyEl) {
    bodyEl.innerHTML = '<div class="batch-progress show">' +
      '<span>✅ 批量生成完成，共 ' + totalCount + ' 条结果已缓存</span>' +
      '<div class="batch-progress-bar"><div class="batch-progress-fill" style="width:100%"></div></div></div>' +
      '<pre style="margin-top:8px;color:#1a7f37;">点击右上角"📊 结果缓存"查看所有生成结果并进行对比。</pre>';
  }

  // 更新缓存计数和面板
  updateCacheBadge();
  renderCachePanel();
  saveCacheToBackend();

  // 自动打开缓存面板
  const cachePanel = document.getElementById('cache-panel');
  const cacheBtn = document.querySelector('.cache-entry-btn');
  if (!cachePanel.classList.contains('open')) {
    cachePanel.classList.add('open');
    cacheBtn.classList.add('active');
  }
}

/**
 * 更新缓存徽章数字
 */
function updateCacheBadge() {
  let total = 0;
  Object.values(window._resultCache).forEach(g => { total += g.results.length; });
  const badge = document.getElementById('cache-count');
  if (badge) badge.textContent = total;
}

/**
 * 切换缓存面板
 */
function toggleCachePanel(btn) {
  const panel = document.getElementById('cache-panel');
  const isOpen = panel.classList.toggle('open');
  btn.classList.toggle('active', isOpen);
  if (isOpen) renderCachePanel();
}

/**
 * 渲染缓存面板内容
 */
function renderCachePanel() {
  const container = document.getElementById('cache-list');
  const keys = Object.keys(window._resultCache);

  if (keys.length === 0) {
    container.innerHTML = '<div class="cache-empty">暂无缓存结果，点击"批量生成"开始</div>';
    return;
  }

  container.innerHTML = keys.map((key, groupIdx) => {
    const group = window._resultCache[key];
    const results = group.results || [];
    const geePreview = group.gee_code.substring(0, 200).replace(/\s+/g, ' ');

    const resultsHtml = results.map((r, idx) => {
      const feasColor = r.feasibility === 'full_feasible' ? '#dafbe1' :
                       r.feasibility === 'partial_feasible' ? '#fff8c5' : '#ffebe9';
      const feasText = r.feasibility === 'full_feasible' ? '✅ 完全可行' :
                      r.feasibility === 'partial_feasible' ? '⚠️ 部分可行' :
                      r.feasibility === 'infeasible' ? '❌ 不可执行' : '❓ 未知';
      return '<div class="cache-result-item" id="cache-result-' + r.id + '">' +
        '<div class="cache-result-header" onclick="toggleCacheResult(\'' + r.id + '\')">' +
          '<div class="cache-result-left">' +
            '<div class="cache-result-num">' + (idx + 1) + '</div>' +
            '<span class="cache-result-time">' + escapeHtml(r.timestamp) + ' · ' + r.elapsed_ms + 'ms</span>' +
            '<span class="cache-result-feasibility" style="background:' + feasColor + ';">' + feasText + '</span>' +
          '</div>' +
          '<span class="cache-result-toggle">▶</span>' +
        '</div>' +
        '<div class="cache-result-body">' +
          '<div style="font-size:11px;color:#656d76;margin-bottom:4px;">引擎: ' + escapeHtml(r.engine) + '</div>' +
          '<pre class="cache-result-code">' + escapeHtml(r.oge_code || '(无代码)') + '</pre>' +
          '<div class="cache-result-actions">' +
            '<button class="cache-result-btn" onclick="event.stopPropagation();copyCacheResult(\'' + r.id + '\')">📋 复制</button>' +
            '<button class="cache-result-btn" onclick="event.stopPropagation();loadCacheToPretty(\'' + r.id + '\')">🎨 美化视图</button>' +
            '<button class="cache-result-btn cache-result-btn-danger" onclick="event.stopPropagation();deleteCacheResult(\'' + key + '\',\'' + r.id + '\')">🗑️ 删除</button>' +
          '</div>' +
        '</div>' +
      '</div>';
    }).join('');

    return '<div class="cache-group' + (groupIdx === 0 ? ' expanded' : '') + '" id="cache-group-' + groupIdx + '">' +
      '<div class="cache-group-header" onclick="toggleCacheGroup(' + groupIdx + ')">' +
        '<div class="cache-group-icon">📝</div>' +
        '<div class="cache-group-info">' +
          '<div class="cache-group-title">GEE 输入 #' + (groupIdx + 1) + '</div>' +
          '<div class="cache-group-meta">' +
            '<span class="cache-count-badge">' + results.length + ' 条结果</span>' +
            '<span>' + escapeHtml(geePreview) + '</span>' +
          '</div>' +
        '</div>' +
        '<div class="cache-group-actions" onclick="event.stopPropagation();compareGroupResults(\'' + key + '\')">' +
          '<button class="cache-compare-btn" ' + (results.length < 1 ? 'disabled style="opacity:0.5;cursor:not-allowed;"' : '') + '>🔍 对比所有</button>' +
        '</div>' +
        '<div class="cache-toggle-icon">▶</div>' +
      '</div>' +
      '<div class="cache-group-body">' +
        '<div class="cache-gee-preview">' + escapeHtml(group.gee_code) + '</div>' +
        resultsHtml +
      '</div>' +
    '</div>';
  }).join('');
}

/**
 * 对比同一组所有生成结果
 */
function compareGroupResults(groupKey) {
  const group = window._resultCache[groupKey];
  if (!group) return;

  const results = group.results || [];
  if (results.length < 1) {
    showToast('暂无结果可查看', 'warning');
    return;
  }

  // 创建对比模态框
  const modal = document.createElement('div');
  modal.className = 'compare-modal';
  
  // 将代码内容转为 base64 存储，避免 HTML 注入问题
  const resultsHtml = results.map((r, idx) => {
    const feasColor = r.feasibility === 'full_feasible' ? '#1f883d' :
      r.feasibility === 'partial_feasible' ? '#9a6700' : '#cf222e';
    const feasBg = r.feasibility === 'full_feasible' ? '#dafbe1' :
      r.feasibility === 'partial_feasible' ? '#fff8c5' : '#ffebe9';
    const feasText = r.feasibility === 'full_feasible' ? '✅ 可行' :
      r.feasibility === 'partial_feasible' ? '⚠️ 部分' :
      r.feasibility === 'infeasible' ? '❌ 不可行' : '❓ 未知';
    const codeB64 = btoa(unescape(encodeURIComponent(r.oge_code || '')));
    return `
      <div class="compare-result-card">
        <div class="compare-result-header" style="border-left: 4px solid ${feasColor};">
          <div class="compare-result-title">
            <span class="compare-result-num">#${idx + 1}</span>
            <span style="background:${feasBg};color:${feasColor};padding:2px 8px;border-radius:10px;font-size:11px;">${feasText}</span>
          </div>
          <div class="compare-result-meta">
            <span>⏱ ${r.elapsed_ms}ms</span>
            <span>🔧 ${escapeHtml(r.engine)}</span>
            <span>${escapeHtml(r.timestamp)}</span>
          </div>
        </div>
        <pre class="compare-code-block">${escapeHtml(r.oge_code || '(无代码)')}</pre>
        <div class="compare-result-actions">
          <button class="compare-copy-btn" data-code-b64="${codeB64}">📋 复制</button>
        </div>
      </div>
    `;
  }).join('');

  modal.innerHTML = `
    <div class="compare-modal-content">
      <div class="compare-modal-header">
        <h3>🔍 批量结果对比（${results.length} 次生成）</h3>
        <button class="compare-close-btn">×</button>
      </div>
      <div class="compare-modal-body">
        <div class="compare-gee-source">
          <div class="compare-section-title">📝 原始 GEE 代码</div>
          <pre class="compare-code-block">${escapeHtml(group.gee_code)}</pre>
        </div>
        <div class="compare-results-container">
          <div class="compare-section-title">🗂️ 生成的 OGE 代码对比（${results.length} 条）</div>
          <div class="compare-results-grid">${resultsHtml}</div>
          <div class="compare-stats">
            <div class="compare-stat-item">
              <span class="compare-stat-label">总次数</span>
              <span class="compare-stat-value">${results.length}</span>
            </div>
            <div class="compare-stat-item">
              <span class="compare-stat-label">可行次数</span>
              <span class="compare-stat-value" style="color:#1f883d;">${results.filter(r => r.feasibility === 'full_feasible').length}</span>
            </div>
            <div class="compare-stat-item">
              <span class="compare-stat-label">平均耗时</span>
              <span class="compare-stat-value">${Math.round(results.reduce((s, r) => s + r.elapsed_ms, 0) / results.length)}ms</span>
            </div>
            <div class="compare-stat-item">
              <span class="compare-stat-label">代码长度范围</span>
              <span class="compare-stat-value">${Math.min(...results.map(r => (r.oge_code || '').length))} ~ ${Math.max(...results.map(r => (r.oge_code || '').length))} 字符</span>
            </div>
          </div>
        </div>
      </div>
    </div>
  `;
  
  // 绑定关闭按钮
  const closeBtn = modal.querySelector('.compare-close-btn');
  closeBtn.addEventListener('click', () => modal.remove());
  
  // 绑定复制按钮（事件委托）
  modal.addEventListener('click', (e) => {
    if (e.target.classList.contains('compare-copy-btn')) {
      const codeB64 = e.target.getAttribute('data-code-b64');
      const code = decodeURIComponent(escape(atob(codeB64)));
      copyToClipboard(code, '代码已复制');
    }
  });
  
  // 点击背景关闭
  modal.addEventListener('click', (e) => {
    if (e.target === modal) modal.remove();
  });
  
  document.body.appendChild(modal);
}

/**
 * 展开/收起缓存分组
 */
function toggleCacheGroup(idx) {
  document.getElementById('cache-group-' + idx).classList.toggle('expanded');
}

/**
 * 展开/收起单个结果
 */
function toggleCacheResult(resultId) {
  document.getElementById('cache-result-' + resultId).classList.toggle('expanded');
}

/**
 * 复制缓存结果代码
 */
function copyCacheResult(resultId) {
  for (const key of Object.keys(window._resultCache)) {
    const group = window._resultCache[key];
    const r = group.results.find(x => x.id === resultId);
    if (r) {
      copyToClipboard(r.oge_code, 'OGE 代码已复制');
      return;
    }
  }
}

/**
 * 加载缓存结果到美化视图
 */
function loadCacheToPretty(resultId) {
  // 查找缓存结果
  let found = null;
  let groupKey = null;
  for (const key of Object.keys(window._resultCache)) {
    const group = window._resultCache[key];
    const r = group.results.find(x => x.id === resultId);
    if (r) {
      found = r;
      groupKey = key;
      break;
    }
  }

  if (!found) {
    showToast('未找到对应的缓存结果', 'warning');
    return;
  }

  // 检查是否有完整的结果数据
  if (!found.full_result) {
    showToast('该缓存缺少完整结果数据，无法显示美化视图', 'error');
    console.warn('[美化视图] 缓存数据缺少 full_result:', found);
    return;
  }

  // 设置全局结果
  const group = window._resultCache[groupKey];
  window._lastConvertResult = {
    success: true,
    result: found.full_result,
    engine: found.engine,
    _inputGeeCode: group.gee_code
  };

  // 关闭缓存面板
  document.getElementById('cache-panel').classList.remove('open');
  document.querySelector('.cache-entry-btn').classList.remove('active');

  // 打开美化视图模态框并渲染内容
  try {
    openPrettyViewModal();
    renderPrettyViewToContainer('pretty-view-modal-content');
    showToast('美化视图已打开', 'success');
  } catch (err) {
    console.error('[美化视图] 渲染失败:', err);
    showToast('美化视图渲染失败: ' + err.message, 'error');
  }
}

// 美化视图模态框功能
// ============================================================

/**
 * 打开美化视图模态框，将内容渲染到模态框中
 */
function openPrettyViewModal() {
  const modal = document.getElementById('pretty-view-modal');
  modal.style.display = 'flex';
  modal.classList.add('active');
  // 添加ESC键支持
  document.addEventListener('keydown', _prettyModalEscHandler);
}

/**
 * 关闭美化视图模态框
 */
function closePrettyViewModal(event) {
  // 如果是点击事件，只在点击overlay背景时关闭
  if (event && event.type === 'click' && event.target !== event.currentTarget) {
    return; // 点击内容区域不关闭
  }
  const modal = document.getElementById('pretty-view-modal');
  modal.style.display = 'none';
  modal.classList.remove('active');
  document.removeEventListener('keydown', _prettyModalEscHandler);
}

/**
 * ESC键处理函数
 */
function _prettyModalEscHandler(e) {
  if (e.key === 'Escape') {
    closePrettyViewModal();
  }
}

/**
 * 渲染美化视图到模态框指定容器
 * @param {string} containerId - 容器ID
 */
function renderPrettyViewToContainer(containerId) {
  const data = window._lastConvertResult;
  if (!data || !data.result) {
    document.getElementById(containerId).innerHTML = 
      '<div style="padding:40px;text-align:center;color:#656d76;">暂无数据</div>';
    return;
  }

  const r = data.result;
  const container = document.getElementById(containerId);
  if (!container) return;

  // 步骤定义
  const STEP_DEFS = [
    { key: 'step1', title: '语义抽象', desc: '分析任务目标、提取关键参数' },
    { key: 'step2', title: 'API 需求识别', desc: '识别 GEE API 调用、推断变量类型' },
    { key: 'step3', title: 'GEE-OGE 匹配', desc: 'API 映射匹配、识别缺失项' },
    { key: 'step4', title: '步骤级代码生成', desc: '为每个子步骤生成 OGE 代码' },
    { key: 'step5', title: '可行性补全', desc: '识别缺失 API、生成替代方案' },
    { key: 'step6', title: '工作流重构', desc: '组装完整 OGE 工作流代码' }
  ];

  const rate = ((r.match_rate || 0) * 100).toFixed(1);
  const feasibility = r.step6?.feasibility || 'unknown';
  const feasibilityText = {
    'full_feasible': '<span class="badge badge-success">完全可行</span>',
    'partial_feasible': '<span class="badge badge-warning">部分可行</span>',
    'infeasible': '<span class="badge badge-danger">不可执行</span>'
  }[feasibility] || '<span class="badge badge-warning">未知</span>';

  const engine = data.engine || 'rule_based';
  const engineBadge = engine === 'llm_enhanced'
    ? '<span class="badge badge-success">⚡ LLM 增强</span>'
    : '<span class="badge badge-info">📋 规则引擎</span>';

  // LLM 增强信息
  let llmEnhancements = '';
  if (r.llm_enhancements && r.llm_enhancements.length > 0) {
    llmEnhancements = `
      <div style="margin: 12px 0; padding: 10px 14px; background: #dafbe1; border-radius: 6px; font-size: 12px;">
        <strong>🤖 LLM 增强:</strong>
        <ul style="margin: 4px 0 0 16px; padding: 0;">
          ${r.llm_enhancements.map(e => `<li>${escapeHtml(e)}</li>`).join('')}
        </ul>
      </div>
    `;
  }

  // 构建HTML（复用原 renderPrettyView 的结构）

function switchPrettyTabInModal(event, tabName) {

    if (btn.dataset.tab === tabName) {
      btn.style.color = '#58a6ff';
      btn.style.borderBottomColor = '#58a6ff';
      btn.style.fontWeight = '500';
    } else {
      btn.style.color = '#8b949e';
      btn.style.borderBottomColor = 'transparent';
      btn.style.fontWeight = '400';
    }
  });

  // 切换内容显示

      content.style.display = 'block';
    } else {

    }
  });
}

/**
 * 渲染耗时组成展示
 * @param {Object} r - 转换结果对象
 * @returns {string} HTML 字符串
 */
function renderTimingBreakdown(r) {
  if (!r.timing) return '';

  const timing = r.timing;
  const stepNames = {
    step1: '语义抽象',
    step2: 'API 需求识别',
    step3: 'GEE-OGE 匹配',
    step4: '步骤级代码生成',
    step5: '可行性补全',
    step6: '工作流重构',
    llm_code_gen: '🤖 LLM 代码生成'
  };

  // 收集所有步骤耗时
  const items = [];
  for (const [key, name] of Object.entries(stepNames)) {
    if (timing[key] != null) {
      items.push({ key, name, time: timing[key] });
    }
  }

  if (items.length === 0) return '';

  // 计算总耗时（优先用 api_total，否则累加）
  const totalTime = timing.api_total || items.reduce((s, i) => s + i.time, 0);

  // 按耗时排序
  items.sort((a, b) => b.time - a.time);

  // 找出最长步骤用于计算进度条比例
  const maxTime = Math.max(...items.map(i => i.time), 0.001);

  return `
    <div class="section" style="margin-bottom:20px;">
      <h4 style="font-size:14px;font-weight:600;color:#e6edf3;margin-bottom:8px;">
        ⏱ 耗时组成
        <span style="font-size:12px;color:#58a6ff;margin-left:8px;">总计 ${(totalTime * 1000).toFixed(1)}ms</span>
      </h4>
      <div style="background:#161b22;border:1px solid #30363d;border-radius:6px;padding:12px;">
        ${items.map(item => {
          const pct = (item.time / totalTime * 100).toFixed(1);
          const barWidth = (item.time / maxTime * 100).toFixed(1);
          const barColor = item.key === 'llm_code_gen' ? '#bc8cff' : '#58a6ff';
          const isSlow = item.time > 1.0; // 超过1秒标记
          return `
            <div style="margin-bottom:8px;">
              <div style="display:flex;justify-content:space-between;font-size:12px;margin-bottom:4px;">
                <span style="color:${isSlow ? '#d29922' : '#c9d1d9'};">
                  ${isSlow ? '⚠️ ' : ''}${item.name}
                </span>
                <span style="color:#8b949e;font-family:monospace;">
                  ${(item.time * 1000).toFixed(1)}ms <span style="color:#656d76;">(${pct}%)</span>
                </span>
              </div>
              <div style="background:#0d1117;border-radius:3px;height:8px;overflow:hidden;">
                <div style="width:${barWidth}%;height:100%;background:${barColor};border-radius:3px;transition:width 0.3s;"></div>
              </div>
            </div>
          `;
        }).join('')}
      </div>
    </div>
  `;
}

/**
 * 渲染 OGE 代码显示
 */
function renderOGECode() {
  const data = window._lastConvertResult;
  if (!data || !data.result) return '<div style="padding:20px;text-align:center;color:#656d76;">暂无代码</div>';

  const r = data.result;
  let ogeCode = '';
  let codeSource = '';

  if (r.llm_oge_code && r.llm_oge_code.trim()) {
    ogeCode = r.llm_oge_code;
    codeSource = '🤖 LLM 生成';
  } else if (r.step6?.oge_code) {
    ogeCode = r.step6.oge_code;
    codeSource = '📋 规则引擎';
  } else {
    return '<div style="padding:20px;text-align:center;color:#656d76;">未生成代码，请检查转换结果</div>';
  }

  return `
    <div style="margin-bottom: 12px; padding: 10px 14px; background: #ddf4ff; border-radius: 6px; display: flex; justify-content: space-between; align-items: center;">
      <span style="font-size: 13px;"><strong>代码来源:</strong> ${codeSource}</span>
      <span style="font-size: 12px; color: #656d76;">${ogeCode.length} 字符</span>
    </div>
    <pre style="background:#0d1117;border:1px solid #30363d;border-radius:6px;padding:16px;font-size:12px;color:#7ee787;overflow-x:auto;max-height:400px;white-space:pre-wrap;">${escapeHtml(ogeCode)}</pre>
  `;
}

/**
 * 渲染缺失 API 报告
 */
function renderMissingAPIs() {
  const data = window._lastConvertResult;
  if (!data || !data.result) return '<div style="padding:20px;text-align:center;color:#656d76;">暂无数据</div>';

  const r = data.result;
  const missingAPIs = r.missing_apis || [];
  const alternatives = r.step5?.alternatives || {};

  if (missingAPIs.length === 0) {
    return '<div style="padding:20px;text-align:center;color:#3fb950;">✅ 所有 API 都已成功转换</div>';
  }

  return `
    <div style="color:#f85149;margin-bottom:12px;font-size:13px;">⚠️ 有 ${missingAPIs.length} 个 API 在 OGE 中不可用</div>
    <div style="display:flex;flex-direction:column;gap:8px;">
      ${missingAPIs.map(api => {
        const alt = alternatives[api] || '无替代方案';
        return `
          <div style="background:#161b22;border:1px solid #30363d;border-radius:6px;padding:12px;">
            <div style="display:flex;align-items:center;gap:8px;margin-bottom:4px;">
              <span style="color:#f85149;">❌</span>
              <code style="background:#0d1117;padding:2px 6px;border-radius:3px;color:#f85149;font-size:12px;">${escapeHtml(api)}</code>
            </div>
            <div style="font-size:12px;color:#8b949e;margin-left:24px;">
              <strong style="color:#c9d1d9;">替代方案:</strong>
              <span style="color:#3fb950;">${escapeHtml(typeof alt === 'string' ? alt : JSON.stringify(alt))}</span>
            </div>
          </div>
        `;
      }).join('')}
    </div>
  `;
}

/**
 * 复制当前 OGE 代码到剪贴板
 */
function copyCurrentOgeCode() {
  const data = window._lastConvertResult;
  if (!data || !data.result) {
    showToast('暂无代码可复制', 'warning');
    return;
  }

  const r = data.result;
  const ogeCode = r.llm_oge_code || r.step6?.oge_code || '';
  if (!ogeCode) {
    showToast('暂无代码可复制', 'warning');
    return;
  }

  navigator.clipboard.writeText(ogeCode).then(() => {
    showToast('OGE 代码已复制到剪贴板', 'success');
  }).catch(() => {
    showToast('复制失败', 'error');
  });
}

/**
 * 下载当前 OGE 代码为文件
 */
function downloadCurrentOgeCode() {
  const data = window._lastConvertResult;
  if (!data || !data.result) {
    showToast('暂无代码可下载', 'warning');
    return;
  }

  const r = data.result;
  const ogeCode = r.llm_oge_code || r.step6?.oge_code || '';
  if (!ogeCode) {
    showToast('暂无代码可下载', 'warning');
    return;
  }

  const blob = new Blob([ogeCode], { type: 'text/plain;charset=utf-8' });
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url;
  a.download = `oge_code_${Date.now()}.py`;
  a.click();
  URL.revokeObjectURL(url);
  showToast('OGE 代码已下载', 'success');
}

/**
 * 删除单个缓存结果
 */
function deleteCacheResult(groupKey, resultId) {
  const group = window._resultCache[groupKey];
  if (!group) return;
  group.results = group.results.filter(r => r.id !== resultId);
  if (group.results.length === 0) {
    delete window._resultCache[groupKey];
  }
  updateCacheBadge();
  renderCachePanel();
  saveCacheToBackend();
}

/**
 * 清空所有缓存
 */
function clearAllCache() {
  if (Object.keys(window._resultCache).length === 0) return;
  if (!confirm('确定清空所有缓存结果？')) return;
  window._resultCache = {};
  updateCacheBadge();
  renderCachePanel();
  // 同步清空后端文件
  fetch('/api/result-cache', { method: 'DELETE' }).catch(() => {});
  showToast('已清空所有缓存', 'success');
}

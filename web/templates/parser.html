<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>GEE/OGE 文件解析器</title>
<style>
:root{font-family:Arial,"Microsoft YaHei",sans-serif;color:#172033;background:#f4f7fb}*{box-sizing:border-box}body{margin:0}.top{height:58px;background:#12233f;color:#fff;display:flex;align-items:center;padding:0 28px;gap:18px}.top a{color:#b9d4ff;text-decoration:none}.top h1{font-size:18px;margin:0}.layout{max-width:1420px;margin:22px auto;padding:0 20px;display:grid;grid-template-columns:360px minmax(0,1fr);gap:18px}.panel{background:#fff;border:1px solid #dce4ef;border-radius:10px;box-shadow:0 3px 12px #15294d0b}.left{padding:18px}.drop{border:2px dashed #9eb4d3;border-radius:9px;padding:28px 14px;text-align:center;color:#5c6d84;cursor:pointer;background:#f8fbff}.drop.drag{border-color:#2d73d5;background:#edf5ff}.drop strong{display:block;color:#225eae;margin-bottom:6px}.hint{font-size:12px;color:#77869a;line-height:1.5}.section{border-top:1px solid #e7edf5;margin-top:18px;padding-top:16px}.section h3{font-size:13px;margin:0 0 10px;color:#324563}.checklist{max-height:180px;overflow:auto;font-size:12px}.checklist label{display:block;padding:5px 0}.actions{display:flex;gap:8px;flex-wrap:wrap;margin-top:14px}.btn{border:1px solid #c8d5e6;background:#fff;color:#27405f;border-radius:6px;padding:8px 11px;cursor:pointer;font-size:12px}.btn.primary{background:#2469c6;color:#fff;border-color:#2469c6}.btn:disabled{opacity:.45;cursor:not-allowed}.save-state{font-size:11px;color:#64809f;margin-top:10px}.right{min-width:0}.toolbar{padding:14px 16px;display:flex;gap:10px;align-items:center;flex-wrap:wrap;border-bottom:1px solid #e7edf5}.toolbar strong{font-size:14px}.toolbar .spacer{flex:1}.direction{display:flex;border:1px solid #ccd8e8;border-radius:6px;overflow:hidden}.direction button{border:0;background:#fff;padding:8px 10px;font-size:12px;cursor:pointer}.direction button.active{background:#e8f1ff;color:#145eb8;font-weight:600}.items{padding:14px;display:grid;gap:12px}.item{border:1px solid #dbe4f0;border-radius:8px;overflow:hidden}.item-head{background:#f7faff;padding:9px 12px;display:flex;align-items:center;gap:10px}.item-head strong{font-size:13px}.item-head span{font-size:11px;color:#71829a}.item-head .spacer{flex:1}.item-body{display:grid;grid-template-columns:1fr 1fr;min-height:220px}.code{margin:0;padding:12px;background:#101a2b;color:#d8e7ff;white-space:pre-wrap;word-break:break-word;overflow:auto;font:12px/1.5 Consolas,monospace}.result{background:#132e28;color:#d6ffed}.empty{padding:45px;text-align:center;color:#8190a4}.status{font-size:11px;color:#607691}@media(max-width:850px){.layout{grid-template-columns:1fr}.item-body{grid-template-columns:1fr}}
</style></head><body>
<header class="top"><a href="/">← 返回主页</a><h1>GEE / OGE 文件解析与批量翻译</h1></header>
<main class="layout"><aside class="panel left">
<div id="drop" class="drop"><strong>拖入 CSV 或 JSON 文件</strong>也可以点击选择文件<input id="file" type="file" accept=".csv,.json" hidden></div><div id="fileName" class="hint" style="margin-top:8px">尚未选择文件</div>
<div id="selector" class="section" hidden><h3 id="selectorTitle">筛选条目</h3><div id="checks" class="checklist"></div><button class="btn primary" id="apply">应用筛选</button></div>
<div class="section"><h3>翻译方向</h3><div class="direction"><button data-dir="gee_to_oge" class="active">GEE → OGE</button><button data-dir="oge_to_gee">OGE → GEE</button></div><div class="actions"><button class="btn primary" id="batch" disabled>批量翻译全部</button><button class="btn" id="save">保存当前结果</button><button class="btn" id="load">恢复上次保存</button><button class="btn" id="download">导出 JSON</button></div><div id="saveState" class="save-state">未保存</div></div>
</aside><section class="panel right"><div class="toolbar"><strong>代码条目</strong><span id="count" class="status">请先导入文件</span><span class="spacer"></span><span id="notice" class="status"></span></div><div id="items" class="items"><div class="empty">导入文件后，这里会逐条展示 GEE/OGE 代码</div></div></section></main>
<script>
const $=id=>document.getElementById(id);let state={filename:'',format:'',items:[],direction:'gee_to_oge',raw:''};const drop=$('drop'),file=$('file');drop.onclick=()=>file.click();['dragenter','dragover'].forEach(e=>drop.addEventListener(e,x=>{x.preventDefault();drop.classList.add('drag')}));['dragleave','drop'].forEach(e=>drop.addEventListener(e,x=>{x.preventDefault();drop.classList.remove('drag')}));drop.addEventListener('drop',e=>{if(e.dataTransfer.files[0])readFile(e.dataTransfer.files[0])});file.onchange=()=>file.files[0]&&readFile(file.files[0]);
async function readFile(f){$('fileName').textContent='正在读取 '+f.name;state.raw=await f.text();state.filename=f.name;await parseFile()}async function parseFile(selected=[]){const payload={filename:state.filename,content:state.raw,selected_keys:state.format==='json'?selected:[],selected_columns:state.format==='csv'?selected:[]};const j=await fetch('/api/parser/parse',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(payload)}).then(r=>r.json());if(!j.success)return notice(j.error,true);state={...state,...j.data};renderSelector();render();$('fileName').textContent=state.filename+' · '+state.items.length+' 条代码';saveLocal()}function renderSelector(){const keys=state.format==='json'?state.categories:state.columns;$('selector').hidden=!keys.length;$('selectorTitle').textContent=state.format==='json'?'选择 JSON 类别/字段':'选择 CSV 列';$('checks').innerHTML=keys.map(k=>'<label><input type="checkbox" value="'+esc(k)+'" checked> '+esc(k)+'</label>').join('')}$('apply').onclick=()=>parseFile([...document.querySelectorAll('#checks input:checked')].map(x=>x.value));
function render(){$('count').textContent=state.items.length+' 条';$('batch').disabled=!state.items.length;$('items').innerHTML=state.items.length?state.items.map((it,i)=>{const source=state.direction==='gee_to_oge'?it.codes.gee:it.codes.oge;return '<article class="item"><div class="item-head"><input type="checkbox" data-index="'+i+'" checked><strong>'+esc(it.label||it.id)+'</strong><span>'+(it.codes.gee?'GEE':'')+(it.codes.gee&&it.codes.oge?' + ':'')+(it.codes.oge?'OGE':'')+'</span><span class="spacer"></span><span id="status-'+i+'" class="status"></span><button class="btn primary one" data-index="'+i+'">翻译</button></div><div class="item-body"><pre class="code">'+esc(source||'该条目没有当前方向代码')+'</pre><pre id="result-'+i+'" class="code result">'+esc(it.result||'翻译结果将显示在这里')+'</pre></div></article>'}).join(''):'<div class="empty">没有符合筛选条件的代码条目</div>';document.querySelectorAll('.one').forEach(b=>b.onclick=()=>translate(+b.dataset.index));document.querySelectorAll('#items input[type=checkbox]').forEach(x=>x.onchange=saveLocal)}
const MAX_CONCURRENT_TRANSLATIONS=100;
async function translate(i){const it=state.items[i],code=state.direction==='gee_to_oge'?it.codes.gee:it.codes.oge;if(!code)return notice('该条目没有可翻译代码',true);$('status-'+i).textContent='翻译中…';try{const j=await fetch('/api/parser/translate',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({direction:state.direction,code,description:it.label})}).then(r=>r.json());if(j.success){it.result=j.output;$('result-'+i).textContent=j.output;$('status-'+i).textContent='已完成';saveLocal();return true}$('status-'+i).textContent='失败';notice(j.error,true);return false}catch(error){$('status-'+i).textContent='网络失败';notice(String(error),true);return false}}
async function runConcurrent(indices){let next=0,completed=0,failed=0;const worker=async()=>{while(true){const position=next++;if(position>=indices.length)return;const ok=await translate(indices[position]);completed++;if(!ok)failed++;$('count').textContent=completed+'/'+indices.length+' 已完成';saveLocal()}};await Promise.all(Array.from({length:Math.min(MAX_CONCURRENT_TRANSLATIONS,indices.length)},worker));return{completed,failed}}
$('batch').onclick=async()=>{const indices=[...document.querySelectorAll('#items input[type=checkbox]:checked')].map(box=>+box.dataset.index);if(!indices.length)return notice('请先勾选要翻译的条目',true);$('batch').disabled=true;notice('已启动 '+Math.min(MAX_CONCURRENT_TRANSLATIONS,indices.length)+' 路并发翻译');const result=await runConcurrent(indices);$('batch').disabled=false;$('count').textContent=state.items.length+' 条';notice('批量翻译完成：'+result.completed+' 条，失败 '+result.failed+' 条',result.failed>0)};document.querySelectorAll('[data-dir]').forEach(b=>b.onclick=()=>{document.querySelectorAll('[data-dir]').forEach(x=>x.classList.remove('active'));b.classList.add('active');state.direction=b.dataset.dir;render();saveLocal()});
$('save').onclick=saveServer;$('load').onclick=async()=>{const j=await fetch('/api/parser/save').then(r=>r.json());if(j.data&&j.data.items){state=j.data;renderSelector();render();notice('已恢复保存结果')}};$('download').onclick=()=>{const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([JSON.stringify(state,null,2)],{type:'application/json'}));a.download='parser-results.json';a.click()};function saveLocal(){localStorage.setItem('gee-oge-parser',JSON.stringify(state));$('saveState').textContent='已自动保存到浏览器 '+new Date().toLocaleTimeString()}async function saveServer(){const j=await fetch('/api/parser/save',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(state)}).then(r=>r.json());notice(j.success?'已保存到服务器':'保存失败',!j.success);if(j.success)$('saveState').textContent='已保存到服务器 '+j.saved_at}function notice(t,error){$('notice').textContent=t;$('notice').style.color=error?'#bd3a3a':'#27815e';setTimeout(()=>{$('notice').textContent=''},3500)}function esc(s){return String(s??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]))}const old=localStorage.getItem('gee-oge-parser');if(old)try{state=JSON.parse(old);renderSelector();render();$('fileName').textContent='已恢复浏览器自动保存'}catch(e){}
</script></body></html>
